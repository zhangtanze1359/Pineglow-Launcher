<!DOCTYPE html>
<html lang="zh-CN" data-pineglow-product="true">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Pineglow · 松光启动器</title>
<link rel="stylesheet" href="css/figma.css">
<link rel="stylesheet" href="css/pineglow.css">
<link rel="stylesheet" href="css/redesign.css">
</head>
<body>
<!-- MR17：键盘用户可跳过标题栏直达主内容（WCAG 2.4.1）；平时隐藏，获得焦点时出现。
     文案走 data-i18n（applyStaticI18n 会在 init 与语言切换时填充），静态文字仅作 JS 之前的兜底。 -->
<a class="skip-link" href="#contentPanel" data-i18n="a11y.skipToContent">跳到主内容</a>
<div class="win">
	<!-- ============ 标题栏 ============ -->
	<header class="title-bar" id="titleBar">
		<div class="brand">
			<span class="brand-pixel"></span>
			<span class="brand-name">PINEGLOW</span>
			<span class="brand-sub" data-i18n="brand.subtitle">松光启动器</span>
		</div>
		<div class="window-controls">
			<button class="wc wc-min" id="btnMinimize" aria-label="最小化"><svg viewBox="0 0 12 12"><path d="M2 6h8"/></svg></button>
			<button class="wc wc-max" id="btnMaximize" aria-label="最大化"><svg viewBox="0 0 12 12"><rect x="2" y="2" width="8" height="8" rx="1"/></svg></button>
			<button class="wc wc-close" id="btnClose" aria-label="关闭"><svg viewBox="0 0 12 12"><path d="M3 3l6 6M9 3l-6 6"/></svg></button>
		</div>
	</header>

	<!-- ============ 主区 ============ -->
	<div class="main-row">
		<!-- 侧边栏 -->
		<aside class="sidebar">
			<button class="profile" id="btnProfile" type="button" aria-label="账户 / Accounts">
				<div class="avatar" id="profileAvatar"></div>
				<div class="profile-info">
					<span class="profile-name" id="profileName" data-i18n="shell.notSignedIn">未登录</span>
					<span class="profile-status"><span class="status-dot"></span><span id="profileStatus" data-i18n="sidebar.offlineMode">离线模式</span></span>
				</div>
			</button>

			<nav class="navigation" id="navigation">
				<span class="nav-group-label" data-i18n="nav.group.game">GAME</span>
				<button class="nav-item active" data-nav="home">
					<span class="nav-ico nav-ico-play"><svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4Z"/></svg></span>
					<span class="nav-text" data-i18n="nav.home">Play</span>
				</button>
				<button class="nav-item" data-nav="installations">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h5l2 2h7a1 1 0 0 1 1 1v11a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5Z"/></svg></span>
					<span class="nav-text" data-i18n="nav.installations">Installations</span>
				<span class="nav-count" data-nav-count="installations" hidden></span></button>
				<button class="nav-item" data-nav="worlds">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M3 12h18M12 3a15 15 0 0 1 0 18M12 3a15 15 0 0 0 0 18"/></svg></span>
					<span class="nav-text" data-i18n="nav.worlds">Worlds</span>
				<span class="nav-count" data-nav-count="worlds" hidden></span></button>
				<button class="nav-item" data-nav="servers">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="7" rx="1.5"/><rect x="3" y="13" width="18" height="7" rx="1.5"/><path d="M7 7.5h.01M7 16.5h.01"/></svg></span>
					<span class="nav-text" data-i18n="nav.servers">Servers</span>
				<span class="nav-count" data-nav-count="servers" hidden></span></button>

				<button class="nav-item" data-nav="playtime">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l4 2"/></svg></span>
					<span class="nav-text" data-i18n="nav.playtime">游戏时长</span>
				</button>
				<span class="nav-group-label" data-i18n="nav.group.library">LIBRARY</span>
				<button class="nav-item" data-nav="content">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M12 3l9 5-9 5-9-5 9-5ZM3 12l9 5 9-5M3 17l9 5 9-5"/></svg></span>
					<span class="nav-text" data-i18n="nav.content">Content</span>
				</button>
				<button class="nav-item" data-nav="skins">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="7" r="4"/><path d="M5 21v-1a6 6 0 0 1 6-6h2a6 6 0 0 1 6 6v1"/></svg></span>
					<span class="nav-text" data-i18n="nav.skins">Skins</span>
				</button>
				<button class="nav-item" data-nav="downloads">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M12 3v12M7 10l5 5 5-5M4 20h16"/></svg></span>
					<span class="nav-text" data-i18n="nav.downloads">Downloads</span>
				<span class="nav-count" data-nav-count="downloads" hidden></span></button>
				<button class="nav-item" data-nav="news">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><path d="M4 5a1 1 0 0 1 1-1h14a1 1 0 0 1 1 1v14a1 1 0 0 1-1 1H5a1 1 0 0 1-1-1V5Z"/><path d="M8 8h8M8 12h8M8 16h5"/></svg></span>
					<span class="nav-text" data-i18n="nav.news">News</span>
				</button>
				<span class="nav-group-label" data-i18n="nav.group.system">系统</span>
				<button class="nav-item" data-nav="settings">
					<span class="nav-ico"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M19.4 13a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 1 1-2.83 2.83l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 1 1-4 0v-.09a1.65 1.65 0 0 0-1.08-1.51 1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 1 1-2.83-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 1 1 0-4h.09a1.65 1.65 0 0 0 1.51-1.08 1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 1 1 2.83-2.83l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 1 1 4 0v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 1 1 2.83 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 1 1 0 4h-.09a1.65 1.65 0 0 0-1.51 1z"/></svg></span>
					<span class="nav-text" data-i18n="nav.settings">Settings</span>
				</button>
			</nav>

			<div class="sidebar-footer">
				<div class="lang-switch" role="group" aria-label="Language"><button id="btnLangZh" type="button" aria-pressed="true">中文</button><button id="btnLangEn" type="button" aria-pressed="false">EN</button></div>
				<div class="build-note"><span id="shellVersion">PINEGLOW</span><span data-i18n="shell.newUi">新版界面</span></div>
			</div>
		</aside>

		<!-- 内容面板 -->
		<main class="workspace-main">
			<header class="workspace-topbar">
				<div><h1 id="workspaceTitle" data-i18n="nav.home">开始游戏</h1><p id="workspaceSubtitle"></p></div>
				<div class="workspace-actions"><button class="quick-open" id="btnQuickOpen" type="button"><svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="11" cy="11" r="7"/><path d="m16 16 5 5"/></svg><span data-i18n="shell.quick">快速操作</span><kbd>Ctrl</kbd><kbd>K</kbd></button><button class="ui-button refresh-view" id="btnRefreshView" type="button" aria-label="刷新 / Refresh"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 7v5h-5M4 17v-5h5"/><path d="M6 7a7 7 0 0 1 12 0M18 17a7 7 0 0 1-12 0"/></svg></button></div>
			</header>
		<section class="content-panel" id="contentPanel" tabindex="-1" aria-labelledby="workspaceTitle">
			<!-- Play -->
			<div class="view" id="view-home"></div>
			<!-- Installations -->
			<div class="view" id="view-installations" hidden></div>
			<!-- Worlds -->
			<div class="view" id="view-worlds" hidden></div>
			<!-- Servers -->
			<div class="view" id="view-servers" hidden></div>
			<div class="view" id="view-playtime" hidden></div>
			<!-- Content -->
			<div class="view" id="view-content" hidden></div>
			<!-- Skins -->
			<div class="view" id="view-skins" hidden></div>
			<!-- Downloads -->
			<div class="view" id="view-downloads" hidden></div>
			<!-- News -->
			<div class="view" id="view-news" hidden></div>
			<!-- Settings -->
			<div class="view" id="view-settings" hidden></div>
		</section>
		</main>
	</div>
</div>

<!-- MR17：异步状态必须能被屏幕阅读器感知（WCAG 4.1.3）。
     toast 是"完成/失败/已取消"等异步结果的唯一出口，加上 live region 后无需移动焦点即可被宣读。 -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="modal-host" id="modalHost" hidden></div>

<meta name="pineglow-session-token" content="__PINEGLOW_SESSION_TOKEN__">

<script src="vendor/three.min.js"></script>
<script src="js/skin3d-core.js"></script>
<script src="js/skin3d.js"></script>
<script src="js/i18n.js"></script>
<script src="js/api.js"></script>
<script src="js/playtime.js"></script>
<script src="js/update-monitor.js"></script>
<script src="js/launcher.js"></script>
</body>
</html>
