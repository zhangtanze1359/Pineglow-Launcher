name: Java discovery verification
on:
  push:
    branches: ['codex/release-fix-20261103']
permissions:
  contents: read
jobs:
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Measure enumeration and version processes
        shell: pwsh
        run: dotnet test dev/PineglowLauncher.Tests/Pineglow.Launcher.Tests.csproj -c Release --filter FullyQualifiedName~JavaDiscoveryTimingTests --logger "console;verbosity=normal"
