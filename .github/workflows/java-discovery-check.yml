name: Java discovery verification
on:
  push:
    branches: ['codex/release-fix-20261103']
permissions:
  contents: read
jobs:
  baseline:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          ref: 98465ead60ebc91be014b0c01b8214118058e473
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Measure original product without repair
        shell: pwsh
        run: dotnet test dev/PineglowLauncher.Tests/Pineglow.Launcher.Tests.csproj -c Release --filter FullyQualifiedName~JavaDiscoveryTimingTests --logger "console;verbosity=detailed"
  diagnose:
    runs-on: windows-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Measure enumeration and version processes
        shell: pwsh
        run: dotnet test dev/PineglowLauncher.Tests/Pineglow.Launcher.Tests.csproj -c Release --filter "FullyQualifiedName~JavaDiscoveryTimingTests|FullyQualifiedName~DiagnoseProgressGateTests|FullyQualifiedName~JavaLocatorProcessTests" --logger "console;verbosity=detailed"
      - name: Locked restore
        run: dotnet restore dev/PineglowLauncher.Tests/Pineglow.Launcher.Tests.csproj --locked-mode
      - name: All Windows tests
        run: dotnet test dev/PineglowLauncher.Tests/Pineglow.Launcher.Tests.csproj -c Release --no-restore --logger "trx;LogFileName=windows.trx" --results-directory results
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: java-discovery-windows-tests
          path: results/*.trx
  ubuntu:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24.19.0'
      - name: Front-end inventory and full tests
        run: node scripts/run-inventory-tests.cjs
