name: Release

# 打 tag（v1.0.1 格式）时触发：构建单文件 exe + 生成自更新 manifest，发布到 GitHub Releases。
# 国内可再用对象存储/CDN 中转 manifest 与 exe。

on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 10
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Compute version (from tag)
        id: version
        shell: pwsh
        run: |
          # tag 形如 v1.2.3 → 去掉 v 前缀，作为单一声明版本（与运行时 LauncherVersion 一致）
          $ver = "${{ github.ref_name }}".Substring(1)
          echo "version=$ver" >> $env:GITHUB_OUTPUT

      - name: Publish (win-x64 single file)
        run: dotnet publish dev/PineglowLauncher/Pineglow.Launcher.csproj -c Release -r win-x64 --self-contained /p:PublishSingleFile=true /p:EnableCompressionInSingleFile=true /p:DebugType=None /p:DebugSymbols=false /p:PublishDir=dist /p:Version=${{ steps.version.outputs.version }}

      - name: Rename exe + generate manifest
        id: manifest
        shell: pwsh
        run: |
          $exe = Get-ChildItem dist/*.exe | Select-Object -First 1
          $final = "dist/Pineglow-Launcher-win-x64-single-file.exe"
          Move-Item $exe.FullName $final -Force
          $size = (Get-Item $final).Length
          $hash = (Get-FileHash $final -Algorithm SHA256).Hash.ToLower()
          $version = "${{ steps.version.outputs.version }}"
          $tag = "${{ github.ref_name }}"
          $ghUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/Pineglow-Launcher-win-x64-single-file.exe"
          $manifest = [ordered]@{
            version   = $version
            url       = $ghUrl
            size      = $size
            sha256    = $hash
            notes     = "Pineglow Launcher $version"
            mandatory = $false
          }
          ($manifest | ConvertTo-Json) | Set-Content -Path dist/manifest.json -Encoding utf8

      # 国内中转：将 exe 上传到 Gitee 同名 release，并把 manifest.url 指向 Gitee 直链、fallbackUrl 保留 GitHub。
      # 需在 GitHub 仓库 Secrets 配置 GITEE_TOKEN（Gitee 私人令牌，需 projects 权限）。
      # 未配置 GITEE_TOKEN 时脚本内自动跳过，仅发布 GitHub（manifest.url 保持 GitHub 直链）。
      # 注意：if 条件不能引用 secrets（Actions 限制），故在脚本内判断。
      - name: Mirror to Gitee (optional)
        shell: pwsh
        env:
          GITEE_TOKEN: ${{ secrets.GITEE_TOKEN }}
        run: |
          $token = $env:GITEE_TOKEN
          if ([string]::IsNullOrWhiteSpace($token)) {
            Write-Host "GITEE_TOKEN 未配置，跳过 Gitee 镜像"
            exit 0
          }
          $owner = "${{ github.repository_owner }}"
          $repo  = "pineglow-launcher"
          $tag   = "${{ github.ref_name }}"
          $ver   = "${{ steps.version.outputs.version }}"
          $exePath = "dist/Pineglow-Launcher-win-x64-single-file.exe"
          $ghUrl = "https://github.com/${{ github.repository }}/releases/download/$tag/Pineglow-Launcher-win-x64-single-file.exe"
          $api = "https://gitee.com/api/v5/repos/$owner/$repo"

          # 1. 创建或复用 Gitee release
          $headers = @{ "Content-Type" = "application/json" }
          $body = @{ access_token = $token; tag_name = $tag; name = $tag; body = "Pineglow Launcher $ver"; target_commitish = "master" } | ConvertTo-Json
          $release = $null
          try {
            $release = Invoke-RestMethod -Uri "$api/releases" -Method Post -Headers $headers -Body $body -TimeoutSec 30
          } catch {
            # 已存在（重复发版）则按 tag 查询
            try { $release = Invoke-RestMethod -Uri "$api/releases/tags/$tag" -Method Get -Headers $headers -TimeoutSec 30 } catch { throw "Gitee release 创建/查询失败: $_" }
          }
          Write-Host "Gitee release id: $($release.id)"

          # 2. 上传 exe 附件（先清同名旧附件避免重复）
          try {
            $attachments = Invoke-RestMethod -Uri "$api/releases/$($release.id)/attach_files" -Method Get -Headers $headers -TimeoutSec 30
            foreach ($a in $attachments) {
              if ($a.name -eq "Pineglow-Launcher-win-x64-single-file.exe") {
                Invoke-RestMethod -Uri "$api/releases/$($release.id)/attach_files/$($a.id)" -Method Delete -Headers $headers -TimeoutSec 30 | Out-Null
              }
            }
          } catch { Write-Host "清理旧附件跳过: $_" }

          $form = @{ access_token = $token; file = Get-Item $exePath }
          $uploaded = Invoke-RestMethod -Uri "$api/releases/$($release.id)/attach_files" -Method Post -Form $form -TimeoutSec 300
          $giteeUrl = $uploaded.browser_download_url
          Write-Host "Gitee 附件: $giteeUrl"

          # 3. 重写 manifest：主地址 Gitee，备用 GitHub
          $manifest = @{
            version   = $ver
            url       = $giteeUrl
            fallbackUrl = $ghUrl
            size      = (Get-Item $exePath).Length
            sha256    = (Get-FileHash $exePath -Algorithm SHA256).Hash.ToLower()
            notes     = "Pineglow Launcher $ver"
            mandatory = $false
          }
          ($manifest | ConvertTo-Json) | Set-Content -Path dist/manifest.json -Encoding utf8
          Write-Host "manifest 已重写为 Gitee 主源 + GitHub 备用"

          # 4. 更新 Gitee 仓库根 update.json（固定地址，用户 config 默认指向它）
          #    Gitee contents API：文件不存在用 POST 创建；已存在用 PUT 更新（带 sha）
          $contentB64 = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes(($manifest | ConvertTo-Json)))
          $updatePath = "update.json"
          $fileSha = $null
          try {
            $existing = Invoke-RestMethod -Uri "$api/contents/$updatePath" -Method Get -Headers $headers -TimeoutSec 30
            $fileSha = $existing.sha
            Write-Host "update.json 已存在 sha=$fileSha"
          } catch { Write-Host "update.json 尚不存在，将创建" }
          $updateBody = @{ access_token = $token; content = $contentB64; message = "release: $tag" }
          $method = "PUT"
          if ($fileSha) { $updateBody.sha = $fileSha } else { $method = "POST" }
          try {
            Invoke-RestMethod -Uri "$api/contents/$updatePath" -Method $method -Headers $headers -Body ($updateBody | ConvertTo-Json) -TimeoutSec 30 | Out-Null
            Write-Host "update.json 已更新: $api/raw/master/$updatePath"
          } catch { Write-Host "update.json 更新失败: $_" }

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          files: |
            dist/Pineglow-Launcher-win-x64-single-file.exe
            dist/manifest.json
