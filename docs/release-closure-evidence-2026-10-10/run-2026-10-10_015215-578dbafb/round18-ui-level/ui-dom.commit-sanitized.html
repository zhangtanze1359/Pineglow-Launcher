<html lang="zh-CN"><head>

<a class="skip-link" href="#view-home" data-i18n="a11y.skipToContent">跳到主内容</a>

			<div class="view" id="view-home" tabindex="-1" data-rendered="1">
	<div class="play-view">
		<div class="banner">

			<div class="banner-body">
				<span class="banner-badge">PINEGLOW · JAVA EDITION</span>
				<h1 class="banner-title">回到你的方块世界。</h1>

			<div class="banner-stats">

				<span class="bs-item"><b>7</b> 个实例</span>

				</div>
			</div>
			<button class="play-btn" id="btnPlay">
				<svg viewBox="0 0 24 24"><path d="M6 4l14 8-14 8V4Z"></path></svg>
				<span>开始游戏</span>
			</button>
			<div class="pf-right">
				<span class="pf-edition">Java 版</span>
				<span class="pf-status">7 个实例可用</span>

					<span class="news-cat">Minecraft: Java Edition</span>
					<span class="news-card-title">New on Realms: The 8 Maps Of Java Realms Day</span>
				</span>
				<span class="news-date">2023-12-21</span>
			</button><button class="news-card" data-news="Universal New Year’s Celebration" data-link-id="HCFvc3rELwRl8ZVLDBayIg" data-link-ok="1">

				<span class="news-card-body">
					<span class="news-cat">Minecraft for Windows</span>
					<span class="news-card-title">Universal New Year’s Celebration</span>
				</span>
				<span class="news-date">2023-12-12</span>
			</button></div>
		</div>
	</div></div>

			<div class="view" id="view-installations" hidden=""></div>

</div>

<!-- MR17：异步状态必须能被屏幕阅读器感知（WCAG 4.1.3）。
     toast 是"完成/失败/已取消"等异步结果的唯一出口，加上 live region 后无需移动焦点即可被宣读。 -->
<div class="toast" id="toast" role="status" aria-live="polite" aria-atomic="true"></div>
<div class="modal-host" id="modalHost" hidden=""></div>

<meta name="pineglow-session-token" content="REDACTED_LOCAL_SESSION_TOKEN">
