<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>松光启动器 · UI 重构原型 / Pineglow Launcher</title>
<style>
/* ─────────────────────────────────────────────────────────────────────────
 * 设计系统令牌 · Raycast（verbatim contract — 不新增、不重定义）
 * ─────────────────────────────────────────────────────────────────── */
:root {
  /* ─── Surface ──────────────────────────────────────────────────── */
  --bg:           #07080a;              /* near-black blue tint — the void */
  --surface:      #101111;              /* Surface 100 — elevated cards */
  --surface-warm: var(--surface);       /* no warm tier in cold dark system */

  /* ─── Foreground ───────────────────────────────────────────────── */
  --fg:    #f9f9f9;                     /* near-white primary text */
  --fg-2:  #cecece;                     /* light gray secondary body */
  --muted: #9c9c9d;                     /* medium gray tertiary / nav links */
  --meta:  #6a6b6c;                     /* dim gray placeholders / metadata */

  /* ─── Border ───────────────────────────────────────────────────── */
  --border:      rgba(255, 255, 255, 0.06);   /* card containment — barely visible */
  --border-soft: rgba(255, 255, 255, 0.04);   /* inner row separator */

  /* ─── Accent ───────────────────────────────────────────────────── */
  --accent:        #FF6363;             /* Raycast Red — hero stripes, error states */
  --accent-on:     #ffffff;
  --accent-hover:  #ff7777;             /* lighter tone for hover */
  --accent-active: #e85757;             /* darker tone for pressed */

  /* ─── Semantic ─────────────────────────────────────────────────── */
  --success: hsl(151, 59%, 59%);        /* Raycast Green */
  --warn:    hsl(43, 100%, 60%);        /* Raycast Yellow */
  --danger:  hsl(0, 100%, 69%);         /* Error Red (≈ #FF6363) */

  /* ─── Typography ───────────────────────────────────────────────── */
  --font-display: "Inter", "Inter Fallback", "SF Pro Display", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-body:    "Inter", "Inter Fallback", "SF Pro Text", -apple-system, system-ui, "Segoe UI", Roboto, sans-serif;
  --font-mono:    "GeistMono", ui-monospace, "SF Mono", "Roboto Mono", Menlo, Monaco, Consolas, monospace;

  --text-xs:   12px;
  --text-sm:   14px;
  --text-base: 16px;
  --text-lg:   18px;
  --text-xl:   20px;
  --text-2xl:  24px;
  --text-3xl:  40px;
  --text-4xl:  64px;

  --leading-body:     1.6;
  --leading-tight:    1.1;
  --tracking-display: 0px;

  /* ─── Spacing ──────────────────────────────────────────────────── */
  --space-1:  4px;
  --space-2:  8px;
  --space-3:  12px;
  --space-4:  16px;
  --space-5:  20px;
  --space-6:  24px;
  --space-8:  32px;
  --space-12: 48px;

  --section-y-desktop: 96px;
  --section-y-tablet:  64px;
  --section-y-phone:   40px;

  /* ─── Radius ───────────────────────────────────────────────────── */
  --radius-sm:   6px;
  --radius-md:   12px;
  --radius-lg:   16px;
  --radius-pill: 9999px;

  /* ─── Elevation ────────────────────────────────────────────────── */
  --elev-flat:   none;
  --elev-ring:   rgb(27, 28, 30) 0px 0px 0px 1px, rgb(7, 8, 10) 0px 0px 0px 1px inset;
  --elev-raised:
    rgba(255, 255, 255, 0.05) 0px 1px 0px 0px inset,
    rgba(0, 0, 0, 0.28) 0px 1.189px 2.377px,
    0 0 0 1px rgba(255, 255, 255, 0.06);

  /* ─── Focus ────────────────────────────────────────────────────── */
  --focus-ring: 0 0 0 3px hsla(202, 100%, 67%, 0.35);

  /* ─── Motion ───────────────────────────────────────────────────── */
  --motion-fast:   150ms;
  --motion-base:   200ms;
  --ease-standard: cubic-bezier(0.2, 0, 0, 1);

  /* ─── Layout ───────────────────────────────────────────────────── */
  --container-max:            1200px;
  --container-gutter-desktop: 24px;
  --container-gutter-tablet:  16px;
  --container-gutter-phone:   12px;
}

/* ─────────────────────────────────────────────────────────────────────────
 * 派生层（只由上面的令牌 color-mix 得出，不引入新色值）
 * ─────────────────────────────────────────────────────────────────── */
:root {
  --fill-1:      color-mix(in oklch, var(--fg) 4%, transparent);
  --fill-2:      color-mix(in oklch, var(--fg) 7%, transparent);
  --fill-3:      color-mix(in oklch, var(--fg) 11%, transparent);
  --line-2:      color-mix(in oklch, var(--fg) 10%, transparent);
  --line-3:      color-mix(in oklch, var(--fg) 16%, transparent);
  --accent-soft: color-mix(in oklch, var(--accent) 15%, transparent);
  --success-soft:color-mix(in oklch, var(--success) 15%, transparent);
  --warn-soft:   color-mix(in oklch, var(--warn) 15%, transparent);
  --danger-soft: color-mix(in oklch, var(--danger) 15%, transparent);
  --info:        hsl(202, 100%, 67%);
  --info-soft:   color-mix(in oklch, var(--info) 15%, transparent);
  --scrim:       color-mix(in oklch, var(--bg) 76%, transparent);
  --ink:         var(--bg);
  /* 松林夜景重着色层 */
  --art-sky-top: var(--bg);
  --art-sky-bot: color-mix(in oklch, var(--bg) 62%, var(--muted));
  --art-sun:     var(--accent);
  --art-ridge-3: color-mix(in oklch, var(--bg) 72%, var(--muted));
  --art-ridge-2: color-mix(in oklch, var(--bg) 80%, var(--muted));
  --art-ridge-1: color-mix(in oklch, var(--bg) 88%, var(--muted));
  --art-near:    var(--surface);
  --art-pine-3:  color-mix(in oklch, var(--bg) 78%, var(--muted));
  --art-pine-2:  color-mix(in oklch, var(--bg) 86%, var(--muted));
  --art-pine-1:  color-mix(in oklch, var(--bg) 94%, var(--muted));
  --art-mist:    color-mix(in oklch, var(--muted) 22%, transparent);
  --art-grass:   color-mix(in oklch, var(--bg) 84%, var(--muted));
}

/* ─────────────────────────── reset & base ─────────────────────────── */
*, *::before, *::after { box-sizing: border-box; }
html, body { height: 100%; }
html { color-scheme: dark; }
body {
  margin: 0;
  background: var(--bg);
  color: var(--fg);
  font-family: var(--font-body);
  font-size: var(--text-sm);
  font-weight: 500;
  line-height: var(--leading-body);
  letter-spacing: 0.2px;
  font-feature-settings: "calt" 1, "kern" 1, "liga" 1, "ss03" 1;
  -webkit-font-smoothing: antialiased;
  text-rendering: optimizeLegibility;
  overflow: hidden;
}
h1, h2, h3, h4 { margin: 0; font-family: var(--font-display); font-weight: 600; letter-spacing: -0.01em; }
p { margin: 0; text-wrap: pretty; }
button, input, select, textarea { font: inherit; color: inherit; letter-spacing: inherit; }
button { background: none; border: 0; cursor: pointer; padding: 0; }
a { color: inherit; text-decoration: none; }
img, svg { display: block; }
ul, ol { margin: 0; padding: 0; list-style: none; }
:focus-visible { outline: none; box-shadow: var(--focus-ring); border-radius: var(--radius-sm); }
::selection { background: var(--accent-soft); color: var(--fg); }
::-webkit-scrollbar { width: 10px; height: 10px; }
::-webkit-scrollbar-track { background: transparent; }
::-webkit-scrollbar-thumb { background: var(--fill-2); border-radius: var(--radius-pill); border: 3px solid transparent; background-clip: content-box; }
::-webkit-scrollbar-thumb:hover { background: var(--fill-3); background-clip: content-box; }

.skip-link {
  position: fixed; top: var(--space-2); left: var(--space-2); z-index: 60;
  transform: translateY(-200%);
  padding: var(--space-2) var(--space-4);
  background: var(--surface); border: 1px solid var(--line-3); border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  transition: transform var(--motion-fast) var(--ease-standard);
}
.skip-link:focus-visible { transform: translateY(0); }

/* ─────────────────────────── 工具类 ─────────────────────────── */
.num  { font-family: var(--font-mono); font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }
.meta { font-family: var(--font-mono); font-size: var(--text-xs); color: var(--meta); letter-spacing: 0.2px; }
.mono { font-family: var(--font-mono); }
.muted { color: var(--muted); }
.fg2 { color: var(--fg-2); }
.stack { display: flex; flex-direction: column; }
.row { display: flex; align-items: center; }
.row-between { display: flex; align-items: center; justify-content: space-between; }
.gap-1 { gap: var(--space-1); } .gap-2 { gap: var(--space-2); } .gap-3 { gap: var(--space-3); }
.gap-4 { gap: var(--space-4); } .gap-5 { gap: var(--space-5); } .gap-6 { gap: var(--space-6); }
.grow { flex: 1 1 auto; min-width: 0; }
.truncate { overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.sr-only {
  position: absolute; width: 1px; height: 1px; padding: 0; margin: -1px;
  overflow: hidden; clip: rect(0 0 0 0); white-space: nowrap; border: 0;
}

/* ─────────────────────────── 应用外壳 ─────────────────────────── */
.app { display: flex; flex-direction: column; height: 100vh; overflow: hidden; }

.titlebar {
  flex: 0 0 40px; height: 40px;
  display: flex; align-items: center; justify-content: space-between;
  padding-left: var(--space-4);
  border-bottom: 1px solid var(--border);
  background: var(--bg);
  user-select: none;
}
.brand { display: flex; align-items: center; gap: var(--space-3); }
.brand-mark { width: 15px; height: 17px; color: var(--fg); }
.brand-name { font-family: var(--font-display); font-size: var(--text-xs); font-weight: 700; letter-spacing: 1.6px; }
.brand-div { width: 1px; height: 14px; background: var(--line-2); }
.brand-sub { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.4px; }
.win-controls { display: flex; height: 100%; }
.win-btn {
  width: 44px; height: 100%;
  display: grid; place-items: center;
  color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.win-btn svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.2; fill: none; }
.win-btn:hover { background: var(--fill-2); color: var(--fg); }
.win-btn:focus-visible { box-shadow: inset var(--focus-ring); border-radius: 0; }
.win-btn.close:hover { background: var(--danger); color: var(--ink); }

.body-row { flex: 1 1 auto; display: flex; min-height: 0; }

/* ─────────────────────────── 侧边栏 ─────────────────────────── */
.sidebar {
  flex: 0 0 236px; width: 236px;
  display: flex; flex-direction: column; gap: var(--space-4);
  padding: var(--space-4) var(--space-3) var(--space-3);
  background: var(--bg);
  border-right: 1px solid var(--border);
  overflow-y: auto;
  overflow-x: hidden;
}
.account {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border); border-radius: var(--radius-md);
  background: var(--surface);
  transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.account:hover { border-color: var(--line-2); background: color-mix(in oklch, var(--surface) 82%, var(--fg)); }
.account-avatar {
  width: 30px; height: 30px; flex: 0 0 30px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm);
  background: var(--bg); border: 1px solid var(--line-2);
  color: var(--muted);
}
.account-avatar svg { width: 15px; height: 15px; }
.account-name { font-size: var(--text-sm); font-weight: 600; }
.account-sub { display: flex; align-items: center; gap: 6px; font-size: var(--text-xs); color: var(--muted); }
.dot { width: 6px; height: 6px; flex: 0 0 6px; border-radius: var(--radius-pill); background: var(--meta); }
.dot.online { background: var(--success); box-shadow: 0 0 0 3px var(--success-soft); }
.dot.warn { background: var(--warn); box-shadow: 0 0 0 3px var(--warn-soft); }

.nav { display: flex; flex-direction: column; gap: 2px; }
.nav-group { margin: var(--space-4) 0 var(--space-1) var(--space-3); font-family: var(--font-mono); font-size: 10px; letter-spacing: 1.2px; color: var(--meta); text-transform: uppercase; }
.nav-group:first-child { margin-top: 0; }
.nav-item {
  position: relative;
  display: flex; align-items: center; gap: var(--space-3);
  height: 34px; padding: 0 var(--space-3);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  color: var(--muted); font-size: var(--text-sm);
  transition: background var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard);
}
.nav-item svg { width: 16px; height: 16px; flex: 0 0 16px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.nav-item:hover { background: var(--fill-1); color: var(--fg); }
.nav-item[aria-current="page"] { background: var(--surface); border-color: var(--border); color: var(--fg); }
.nav-item .nav-count { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--meta); }
.nav-item[aria-current="page"] .nav-count { color: var(--fg-2); }
.sidebar-foot { margin-top: auto; display: flex; flex-direction: column; gap: var(--space-3); padding-top: var(--space-3); border-top: 1px solid var(--border); }
.lang-switch { display: flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.lang-switch button {
  flex: 1; height: 24px; border-radius: 4px; font-size: var(--text-xs); color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.lang-switch button:hover { color: var(--fg); }
.lang-switch button[aria-pressed="true"] { background: var(--fill-2); color: var(--fg); }
.build-note { display: flex; align-items: center; justify-content: space-between; gap: var(--space-2); }

/* ─────────────────────────── 主区 ─────────────────────────── */
.main { flex: 1 1 auto; display: flex; flex-direction: column; min-width: 0; background: var(--bg); }
.topbar {
  flex: 0 0 auto;
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-4);
  padding: var(--space-4) var(--space-8) var(--space-3);
  border-bottom: 1px solid var(--border);
}
.page-title { font-size: var(--text-xl); line-height: 1.25; }
.page-sub { margin-top: 2px; font-size: var(--text-xs); color: var(--muted); }
.topbar-right { display: flex; align-items: center; gap: var(--space-3); }
.content { flex: 1 1 auto; overflow-y: auto; padding: var(--space-6) var(--space-8) var(--space-12); }
.view { max-width: var(--container-max); margin: 0 auto; display: flex; flex-direction: column; gap: var(--space-5); }

/* ─────────────────────────── 按钮 ─────────────────────────── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-2);
  height: 34px; padding: 0 var(--space-4);
  border: 1px solid transparent; border-radius: var(--radius-sm);
  font-family: var(--font-display); font-size: var(--text-sm); font-weight: 600; letter-spacing: 0.3px;
  white-space: nowrap;
  transition: background var(--motion-fast) var(--ease-standard),
              border-color var(--motion-fast) var(--ease-standard),
              color var(--motion-fast) var(--ease-standard),
              transform 100ms var(--ease-standard);
}
.btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.7; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.btn:active { transform: translateY(1px); }
.btn:disabled { opacity: 0.45; cursor: not-allowed; transform: none; }
.btn-primary { background: color-mix(in oklch, var(--fg) 82%, transparent); color: var(--ink); }
.btn-primary:hover { background: var(--fg); }
.btn-primary:disabled:hover { background: color-mix(in oklch, var(--fg) 82%, transparent); }
.btn-secondary { border-color: var(--line-2); color: var(--fg); }
.btn-secondary:hover { background: var(--fill-2); border-color: var(--line-3); }
.btn-ghost { color: var(--muted); padding: 0 var(--space-2); }
.btn-ghost:hover { color: var(--fg); background: var(--fill-1); }
.btn-danger { border-color: color-mix(in oklch, var(--danger) 40%, transparent); color: var(--danger); }
.btn-danger:hover { background: var(--danger-soft); border-color: var(--danger); color: var(--danger); }
.btn-lg { height: 44px; padding: 0 var(--space-6); font-size: var(--text-base); border-radius: var(--radius-md); }
.btn-lg svg { width: 18px; height: 18px; }
.btn-sm { height: 28px; padding: 0 var(--space-3); font-size: var(--text-xs); }
.btn-block { width: 100%; }
.btn.is-busy { pointer-events: none; }

.icon-btn {
  width: 30px; height: 30px; display: grid; place-items: center;
  border-radius: var(--radius-sm); color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.icon-btn svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.icon-btn:hover { background: var(--fill-2); color: var(--fg); }
.icon-btn[aria-pressed="true"] { color: var(--warn); }
.icon-btn.danger:hover { background: var(--danger-soft); color: var(--danger); }

.kbd {
  display: inline-flex; align-items: center; gap: 3px;
  padding: 2px 6px; min-width: 20px; justify-content: center;
  border-radius: 4px;
  background: linear-gradient(180deg, color-mix(in oklch, var(--fg) 9%, transparent), color-mix(in oklch, var(--fg) 4%, transparent));
  border: 1px solid var(--border);
  box-shadow: 0 1px 0 0 color-mix(in oklch, var(--fg) 6%, transparent) inset, 0 -1px 0 0 rgba(0, 0, 0, 0.4) inset;
  font-family: var(--font-mono); font-size: 10px; color: var(--muted); letter-spacing: 0.4px;
}

/* ─────────────────────────── 卡片 / 面板 ─────────────────────────── */
.card {
  background: var(--surface); border: 1px solid var(--border);
  border-radius: var(--radius-md);
  padding: var(--space-4);
}
.card-ring { box-shadow: var(--elev-ring); border-color: transparent; }
.card-pad-lg { padding: var(--space-5); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: var(--space-3); margin-bottom: var(--space-3); flex-wrap: wrap; }
.card-head > .row { flex-wrap: wrap; justify-content: flex-end; }
.card-title { font-size: var(--text-sm); font-weight: 600; letter-spacing: 0; }
.card-hint { font-size: var(--text-xs); color: var(--meta); }
.grid-2 { display: grid; grid-template-columns: repeat(2, minmax(0, 1fr)); gap: var(--space-4); }
.grid-3 { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: var(--space-4); }
.grid-4 { display: grid; grid-template-columns: repeat(4, minmax(0, 1fr)); gap: var(--space-3); }
.grid-play { display: grid; grid-template-columns: minmax(0, 1.65fr) minmax(0, 1fr); gap: var(--space-5); align-items: start; }
.split { display: grid; grid-template-columns: minmax(0, 1fr) 260px; gap: var(--space-5); align-items: start; }

/* ─────────────────────────── 芯片 / 徽标 ─────────────────────────── */
.chip {
  display: inline-flex; align-items: center; gap: 5px;
  padding: 2px var(--space-2); height: 20px;
  border: 1px solid var(--border); border-radius: var(--radius-sm);
  background: var(--fill-1);
  font-family: var(--font-mono); font-size: 11px; color: var(--fg-2); letter-spacing: 0.3px;
  white-space: nowrap;
}
.chip svg { width: 11px; height: 11px; stroke: currentColor; stroke-width: 1.8; fill: none; }
.chip-accent { background: var(--accent-soft); border-color: color-mix(in oklch, var(--accent) 35%, transparent); color: var(--accent); }
.chip-ok { background: var(--success-soft); border-color: color-mix(in oklch, var(--success) 32%, transparent); color: var(--success); }
.chip-warn { background: var(--warn-soft); border-color: color-mix(in oklch, var(--warn) 32%, transparent); color: var(--warn); }
.chip-danger { background: var(--danger-soft); border-color: color-mix(in oklch, var(--danger) 32%, transparent); color: var(--danger); }
.tag {
  display: inline-flex; align-items: center; padding: 1px 7px;
  border-radius: var(--radius-sm); background: var(--fill-2);
  font-size: 11px; color: var(--muted); letter-spacing: 0.2px; white-space: nowrap;
}
.tag-accent { background: var(--accent-soft); color: var(--accent); }

/* ─────────────────────────── 表单 ─────────────────────────── */
.field { display: flex; flex-direction: column; gap: 6px; }
.field label { font-size: var(--text-xs); color: var(--muted); letter-spacing: 0.2px; }
.field .hint { font-size: var(--text-xs); color: var(--meta); }
.field .error { display: flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--danger); }
.input, .select, .textarea {
  width: 100%; height: 34px; padding: 0 var(--space-3);
  background: var(--bg); color: var(--fg);
  border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  font-size: var(--text-sm);
  transition: border-color var(--motion-fast) var(--ease-standard), background var(--motion-fast) var(--ease-standard);
}
.textarea { height: auto; min-height: 84px; padding: var(--space-2) var(--space-3); resize: vertical; line-height: 1.55; }
.input::placeholder, .textarea::placeholder { color: var(--meta); }
.input:hover, .select:hover, .textarea:hover { border-color: var(--line-3); }
.input:focus, .select:focus, .textarea:focus { outline: none; border-color: color-mix(in oklch, var(--info) 55%, transparent); box-shadow: var(--focus-ring); }
.input[aria-invalid="true"] { border-color: color-mix(in oklch, var(--danger) 55%, transparent); }
.select { appearance: none; padding-right: var(--space-8); cursor: pointer; background-image: linear-gradient(45deg, transparent 50%, var(--muted) 50%), linear-gradient(135deg, var(--muted) 50%, transparent 50%); background-position: right 14px center, right 9px center; background-size: 5px 5px, 5px 5px; background-repeat: no-repeat; }
.select option { background: var(--surface); color: var(--fg); }
.search { position: relative; flex: 1 1 220px; max-width: 320px; }
.search svg { position: absolute; left: 10px; top: 50%; transform: translateY(-50%); width: 14px; height: 14px; stroke: var(--meta); stroke-width: 1.7; fill: none; pointer-events: none; }
.search .input { padding-left: 32px; }
.search .input:focus { box-shadow: var(--focus-ring); }

.switch { display: inline-flex; align-items: center; gap: var(--space-3); cursor: pointer; }
.switch input { position: absolute; opacity: 0; width: 0; height: 0; }
.switch-track {
  position: relative; width: 34px; height: 20px; flex: 0 0 34px;
  border-radius: var(--radius-pill); background: var(--fill-2); border: 1px solid var(--border);
  transition: background var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard);
}
.switch-track::after {
  content: ""; position: absolute; top: 2px; left: 2px; width: 14px; height: 14px;
  border-radius: var(--radius-pill); background: var(--muted);
  transition: transform var(--motion-base) var(--ease-standard), background var(--motion-base) var(--ease-standard);
}
.switch input:checked + .switch-track { background: color-mix(in oklch, var(--fg) 88%, transparent); border-color: transparent; }
.switch input:checked + .switch-track::after { transform: translateX(14px); background: var(--bg); }
.switch input:focus-visible + .switch-track { box-shadow: var(--focus-ring); }
.switch-label { font-size: var(--text-sm); color: var(--fg-2); }

input[type="range"].range {
  -webkit-appearance: none; appearance: none;
  width: 100%; height: 20px; background: transparent; cursor: pointer;
}
input[type="range"].range::-webkit-slider-runnable-track {
  height: 3px; border-radius: var(--radius-pill);
  background: linear-gradient(90deg, var(--fg) var(--range-fill, 50%), var(--fill-3) var(--range-fill, 50%));
}
input[type="range"].range::-webkit-slider-thumb {
  -webkit-appearance: none; appearance: none;
  width: 13px; height: 13px; margin-top: -5px;
  border-radius: var(--radius-pill); background: var(--fg); border: 0;
  box-shadow: 0 0 0 1px color-mix(in oklch, var(--bg) 70%, transparent);
  transition: transform var(--motion-fast) var(--ease-standard);
}
input[type="range"].range:hover::-webkit-slider-thumb { transform: scale(1.12); }
input[type="range"].range:focus-visible { box-shadow: none; }
input[type="range"].range:focus-visible::-webkit-slider-thumb { box-shadow: var(--focus-ring); }

.check { display: flex; align-items: flex-start; gap: var(--space-2); cursor: pointer; font-size: var(--text-sm); color: var(--fg-2); }
.check input { appearance: none; width: 15px; height: 15px; flex: 0 0 15px; margin: 3px 0 0; border: 1px solid var(--line-3); border-radius: 4px; background: var(--bg); transition: background var(--motion-fast) var(--ease-standard), border-color var(--motion-fast) var(--ease-standard); }
.check input:checked { background: var(--fg); border-color: var(--fg); box-shadow: inset 0 0 0 3px var(--bg); }
.check input:focus-visible { box-shadow: var(--focus-ring); }

.seg { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--border); border-radius: var(--radius-sm); }
.seg button {
  height: 26px; padding: 0 var(--space-3); border-radius: 4px;
  font-size: var(--text-xs); color: var(--muted);
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.seg button:hover { color: var(--fg); background: var(--fill-1); }
.seg button[aria-pressed="true"] { background: var(--fill-2); color: var(--fg); }

/* ─────────────────────────── 列表行 / 表格 ─────────────────────────── */
.list { display: flex; flex-direction: column; }
.list-row {
  display: flex; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-2);
  border-top: 1px solid var(--border-soft);
  flex-wrap: wrap;
  transition: background var(--motion-fast) var(--ease-standard);
}
.list-row:first-child { border-top: 0; }
.list-row:hover { background: var(--fill-1); }
.list-row.is-selected { background: var(--fill-1); box-shadow: inset 2px 0 0 0 var(--fg); }
.list-row .row-title { font-size: var(--text-sm); font-weight: 600; color: var(--fg); }
.list-row .row-sub { font-size: var(--text-xs); color: var(--muted); margin-top: 2px; }
.row-actions { display: flex; align-items: center; gap: var(--space-2); margin-left: auto; }
.row-actions.opacity { opacity: 0; transition: opacity var(--motion-fast) var(--ease-standard); }
.list-row:hover .row-actions.opacity, .list-row:focus-within .row-actions.opacity { opacity: 1; }

.thumb {
  width: 38px; height: 38px; flex: 0 0 38px;
  display: grid; place-items: center;
  border-radius: var(--radius-sm); background: var(--bg); border: 1px solid var(--border);
  color: var(--muted);
}
.thumb svg { width: 17px; height: 17px; stroke: currentColor; stroke-width: 1.6; fill: none; stroke-linecap: round; stroke-linejoin: round; }
.thumb-lg { width: 48px; height: 48px; flex-basis: 48px; }
.thumb-lg svg { width: 21px; height: 21px; }

.kv { display: grid; grid-template-columns: 96px minmax(0, 1fr); gap: var(--space-2) var(--space-4); align-items: baseline; }
.kv dt { font-size: var(--text-xs); color: var(--meta); }
.kv dd { margin: 0; font-size: var(--text-sm); color: var(--fg-2); }

/* ─────────────────────────── 进度 ─────────────────────────── */
.bar { height: 4px; border-radius: var(--radius-pill); background: var(--fill-2); overflow: hidden; }
.bar > i { display: block; height: 100%; border-radius: inherit; background: var(--fg); transition: width 400ms var(--ease-standard); }
.bar.accent > i { background: var(--accent); }
.bar.ok > i { background: var(--success); }
.bar.sm { height: 3px; }

/* ─────────────────────────── 松林夜景资产 ─────────────────────────── */
.art { display: block; width: 100%; height: 100%; }
.art .a-sky-top { stop-color: var(--art-sky-top); }
.art .a-sky-bot { stop-color: var(--art-sky-bot); }
.art .a-sun { fill: var(--art-sun); opacity: 0.85; }
.art .a-rays { fill: var(--art-sky-bot); opacity: 0.13; }
.art .a-ridge-3 { fill: var(--art-ridge-3); }
.art .a-ridge-2 { fill: var(--art-ridge-2); }
.art .a-ridge-1 { fill: var(--art-ridge-1); }
.art .a-near { fill: var(--art-near); }
.art .a-pine-3 { fill: var(--art-pine-3); }
.art .a-pine-2 { fill: var(--art-pine-2); }
.art .a-pine-1 { fill: var(--art-pine-1); }
.art .a-mist-top { stop-color: var(--art-mist); }
.art .a-mist-bot { stop-color: var(--art-mist); stop-opacity: 0; }
.art .a-grass { fill: var(--art-grass); }
.art .a-glow { fill: var(--muted); opacity: 0.7; }
.art-strip {
  position: relative; height: 120px; overflow: hidden;
  border-bottom: 1px solid var(--border);
  border-radius: var(--radius-md) var(--radius-md) 0 0;
}
.art-strip .art { position: absolute; inset: 0; width: 100%; height: 100%; }
.art-strip::after {
  content: ""; position: absolute; inset: 0;
  background: linear-gradient(180deg, transparent 14%, color-mix(in oklch, var(--surface) 94%, transparent) 100%);
}

/* ─────────────────────────── 模态 / 抽屉 ─────────────────────────── */
.scrim {
  position: fixed; inset: 0; z-index: 40;
  background: var(--scrim); backdrop-filter: blur(4px);
  display: grid; place-items: center; padding: var(--space-6);
  animation: fade-in var(--motion-base) var(--ease-standard);
}
.modal {
  width: 100%; max-width: 460px; max-height: calc(100vh - 96px); overflow: auto;
  background: var(--surface); border-radius: var(--radius-md);
  box-shadow: rgba(0, 0, 0, 0.5) 0px 0px 0px 2px, rgba(255, 255, 255, 0.06) 0px 0px 0px 1px inset, rgba(0, 0, 0, 0.55) 0px 24px 60px;
  animation: pop-in var(--motion-base) var(--ease-standard);
}
.modal-head { padding: var(--space-4) var(--space-5) var(--space-3); border-bottom: 1px solid var(--border); }
.modal-title { font-size: var(--text-base); }
.modal-desc { margin-top: 4px; font-size: var(--text-xs); color: var(--muted); }
.modal-body { padding: var(--space-5); display: flex; flex-direction: column; gap: var(--space-4); }
.modal-foot { display: flex; align-items: center; justify-content: flex-end; gap: var(--space-2); padding: var(--space-3) var(--space-5) var(--space-4); }
.modal-foot .left { margin-right: auto; }

/* ─────────────────────────── 命令面板 ─────────────────────────── */
.palette {
  width: 100%; max-width: 560px; margin-top: -8vh;
  background: var(--surface); border-radius: var(--radius-md);
  box-shadow: rgba(0, 0, 0, 0.5) 0px 0px 0px 2px, rgba(255, 255, 255, 0.06) 0px 0px 0px 1px inset, rgba(0, 0, 0, 0.6) 0px 28px 70px;
  overflow: hidden;
  animation: pop-in var(--motion-base) var(--ease-standard);
}
.palette-input { display: flex; align-items: center; gap: var(--space-3); padding: var(--space-3) var(--space-4); border-bottom: 1px solid var(--border); }
.palette-input svg { width: 16px; height: 16px; stroke: var(--muted); stroke-width: 1.7; fill: none; }
.palette-input input { flex: 1; height: 26px; background: none; border: 0; outline: none; font-size: var(--text-sm); }
.palette-input input::placeholder { color: var(--meta); }
.palette-list { position: relative; max-height: 320px; overflow-y: auto; padding: var(--space-2); }
.palette-group { padding: var(--space-2) var(--space-3) 4px; font-family: var(--font-mono); font-size: 10px; letter-spacing: 1px; color: var(--meta); text-transform: uppercase; }
.palette-item {
  display: flex; align-items: center; gap: var(--space-3); width: 100%;
  padding: var(--space-2) var(--space-3); border-radius: var(--radius-sm);
  color: var(--fg-2); font-size: var(--text-sm); text-align: left;
  transition: background var(--motion-fast) var(--ease-standard), color var(--motion-fast) var(--ease-standard);
}
.palette-item svg { width: 15px; height: 15px; stroke: currentColor; stroke-width: 1.6; fill: none; flex: 0 0 15px; }
.palette-item .hint { margin-left: auto; font-family: var(--font-mono); font-size: 10px; color: var(--meta); }
.palette-item[aria-selected="true"] { background: var(--fill-2); color: var(--fg); }
.palette-item[aria-selected="true"] .hint { color: var(--fg-2); }
.palette-foot { display: flex; align-items: center; gap: var(--space-4); padding: var(--space-3) var(--space-4); border-top: 1px solid var(--border); color: var(--meta); font-size: var(--text-xs); }

/* ─────────────────────────── Toast ─────────────────────────── */
.toasts { position: fixed; right: var(--space-6); bottom: var(--space-6); z-index: 50; display: flex; flex-direction: column; gap: var(--space-2); width: 340px; }
.toast {
  display: flex; align-items: flex-start; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  background: var(--surface); border: 1px solid var(--line-2); border-radius: var(--radius-sm);
  box-shadow: rgba(0, 0, 0, 0.4) 0px 12px 32px;
  animation: toast-in var(--motion-base) var(--ease-standard);
}
.toast svg { width: 15px; height: 15px; flex: 0 0 15px; margin-top: 2px; stroke: currentColor; stroke-width: 1.8; fill: none; }
.toast .t-body { min-width: 0; }
.toast .t-title { font-size: var(--text-sm); font-weight: 600; }
.toast .t-desc { font-size: var(--text-xs); color: var(--muted); margin-top: 2px; }
.toast.ok svg { stroke: var(--success); }
.toast.warn svg { stroke: var(--warn); }
.toast.err svg { stroke: var(--danger); }
.toast.info svg { stroke: var(--info); }
.toast.leaving { animation: toast-out var(--motion-base) var(--ease-standard) forwards; }

/* ─────────────────────────── 空 / 错误状态 ─────────────────────────── */
.state {
  display: flex; flex-direction: column; align-items: center; gap: var(--space-2);
  padding: var(--space-8) var(--space-5); text-align: center;
  border: 1px solid var(--border); border-radius: var(--radius-md); background: var(--bg);
}
.state svg { width: 22px; height: 22px; stroke: var(--meta); stroke-width: 1.5; fill: none; margin-bottom: var(--space-1); }
.state .s-title { font-size: var(--text-sm); font-weight: 600; }
.state .s-desc { font-size: var(--text-xs); color: var(--muted); max-width: 42ch; }
.state.err svg { stroke: var(--danger); }

/* ─────────────────────────── 摘要 / 预览 / 技术详情 ─────────────────────────── */
.stat-label { font-size: var(--text-xs); color: var(--meta); }
.stat-value { margin-top: 4px; font-family: var(--font-mono); font-size: var(--text-xl); color: var(--fg); font-variant-numeric: tabular-nums; letter-spacing: 0.2px; }
.hint { font-size: var(--text-xs); color: var(--meta); line-height: 1.7; }
.error { display: flex; align-items: center; gap: 5px; font-size: var(--text-xs); color: var(--danger); }
[hidden] { display: none !important; }
.anywhere { min-width: 0; overflow-wrap: anywhere; }
:focus { scroll-margin-top: 12px; scroll-margin-bottom: 12px; }
.tech { display: inline-block; }
.tech[open] { flex: 1 1 100%; }
.tech summary { list-style: none; cursor: pointer; display: inline-flex; align-items: center; }
.tech summary::-webkit-details-marker { display: none; }
.tech-body {
  margin: var(--space-2) 0 0; padding: var(--space-3); max-height: 170px; overflow: auto;
  background: var(--bg); border: 1px solid var(--border); border-radius: var(--radius-sm);
  font-family: var(--font-mono); font-size: 11px; line-height: 1.7; color: var(--muted);
  white-space: pre-wrap; overflow-wrap: anywhere;
}
.sig { display: inline-flex; align-items: flex-end; gap: 2px; height: 12px; }
.sig i { width: 3px; border-radius: 1px; background: var(--fill-2); }
.sig i:nth-child(1) { height: 4px; }
.sig i:nth-child(2) { height: 8px; }
.sig i:nth-child(3) { height: 12px; }
.sig i.on { background: var(--fg); }
.sig.warn i.on { background: var(--warn); }
.sig.off i.on { background: var(--meta); }
.preview {
  position: relative; min-height: 296px; display: grid; place-items: center; padding: var(--space-5);
  background: var(--bg); border-top: 1px solid var(--border); border-bottom: 1px solid var(--border); overflow: hidden;
}
.preview .state { position: relative; border: 0; background: transparent; max-width: 42ch; }
.preview-grid {
  position: absolute; inset: 0;
  background-image: linear-gradient(var(--border-soft) 1px, transparent 1px), linear-gradient(90deg, var(--border-soft) 1px, transparent 1px);
  background-size: 28px 28px;
  -webkit-mask-image: radial-gradient(ellipse at center, black, transparent 78%);
  mask-image: radial-gradient(ellipse at center, black, transparent 78%);
}
.skins-layout { display: grid; grid-template-columns: minmax(0, 1fr) 320px; gap: var(--space-4); align-items: start; }
@media (max-width: 1040px) { .skins-layout { grid-template-columns: minmax(0, 1fr); } }
.modal-foot { position: sticky; bottom: 0; background: var(--surface); flex-wrap: wrap; }
@media (pointer: coarse) {
  .btn, .btn-sm, .input, .select, .nav-item, .list-row { min-height: 44px; }
  .icon-btn, .win-btn { min-width: 44px; min-height: 44px; }
  .seg button, .lang-switch button { min-height: 32px; }
}

/* ─────────────────────────── 抽屉（管理 Mod / 恢复区） ─────────────────────────── */
.scrim.right { place-items: stretch end; padding: 0; }
.drawer {
  display: flex; flex-direction: column;
  width: min(560px, 94vw); height: 100%;
  background: var(--surface); border-left: 1px solid var(--border);
  box-shadow: rgba(0, 0, 0, 0.55) -24px 0 60px;
  animation: drawer-in var(--motion-base) var(--ease-standard);
  overflow: hidden;
}
.drawer .modal-head { flex: 0 0 auto; display: flex; align-items: flex-start; justify-content: space-between; gap: var(--space-3); }
.drawer .modal-body { flex: 1 1 auto; overflow-y: auto; padding: var(--space-4) var(--space-5); gap: var(--space-3); }
.drawer .modal-foot { flex: 0 0 auto; position: static; }
.drawer-tools { display: flex; flex-direction: column; gap: var(--space-3); }
.drawer .search { flex: 0 0 auto; max-width: none; }
.seg-block { display: flex; width: 100%; }
.seg-block button { flex: 1 1 0; }
.chip:hover { background: var(--fill-2); border-color: var(--line-2); color: var(--fg); }
.list-row.is-off .row-title { color: var(--muted); }
.list-row.is-off .thumb { color: var(--meta); }
.mod-confirm {
  display: flex; flex-wrap: wrap; align-items: center; gap: var(--space-3);
  padding: var(--space-3) var(--space-4);
  border: 1px solid color-mix(in oklch, var(--danger) 32%, transparent);
  background: var(--danger-soft); border-radius: var(--radius-sm);
}
.mod-confirm p { flex: 1 1 190px; font-size: var(--text-xs); color: var(--fg-2); line-height: 1.7; }
.recovery-note { font-size: var(--text-xs); color: var(--warn); line-height: 1.7; margin-top: 2px; }
@keyframes drawer-in { from { opacity: 0; transform: translateX(18px); } to { opacity: 1; transform: none; } }
@media (max-width: 620px) { .drawer { width: 100%; } }

/* ─────────────────────────── 游戏时长：树状图 + 日历 ─────────────────────────── */
.range-bar { display: flex; align-items: center; gap: var(--space-3); flex-wrap: wrap; }
.range-custom { display: flex; align-items: center; gap: var(--space-2); flex-wrap: wrap; padding: var(--space-3); border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg); }
.range-custom .input { width: auto; height: 30px; padding: 0 var(--space-2); font-size: var(--text-xs); }
.range-custom .field { gap: 4px; }
.treemap { position: relative; height: 340px; }
.tm-group {
  position: absolute; overflow: hidden; border-radius: var(--radius-sm);
  background: var(--bg);
}
.tm-head {
  display: flex; align-items: center; justify-content: space-between; gap: var(--space-2);
  height: 22px; padding: 0 var(--space-2); background: var(--tm-strong);
}
.tm-name { font-size: 11px; color: var(--fg); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.tm-total { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
.tm-body { position: relative; }
.tm-cell {
  position: absolute; display: flex; flex-direction: column; justify-content: flex-end; align-items: flex-start;
  padding: 4px 6px; border: 0; border-radius: 3px; overflow: hidden;
  background: var(--tm-fill); color: var(--fg); text-align: left;
  transition: background var(--motion-fast) var(--ease-standard);
}
.tm-cell:hover, .tm-cell:focus-visible { background: var(--tm-strong); }
.tm-cell .tm-date { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); line-height: 1.2; }
.tm-cell .tm-dur { font-family: var(--font-mono); font-size: 12px; font-weight: 600; line-height: 1.25; }
.readout {
  display: flex; align-items: center; gap: var(--space-2); min-height: 36px;
  margin-top: var(--space-3); padding: var(--space-2) var(--space-3);
  border: 1px solid var(--border); border-radius: var(--radius-sm); background: var(--bg);
  font-size: var(--text-xs); color: var(--fg-2);
}
.tm-legend { margin-top: var(--space-4); }
.tm-legend-row { display: flex; align-items: center; gap: var(--space-3); padding: 7px 0; border-top: 1px solid var(--border-soft); font-size: var(--text-xs); }
.tm-swatch { width: 10px; height: 10px; flex: 0 0 10px; border-radius: 3px; }
.tm-legend-name { flex: 1 1 auto; min-width: 0; color: var(--fg-2); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.cal-week, .cal-grid { display: grid; grid-template-columns: repeat(7, minmax(0, 1fr)); gap: 3px; }
.cal-week { margin-bottom: 4px; }
.cal-week span { text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--meta); }
.cal-cell {
  position: relative; display: flex; flex-direction: column; justify-content: space-between; align-items: flex-start;
  min-height: 44px; padding: 3px 4px; overflow: hidden;
  border: 1px solid var(--border); border-radius: 4px; background: var(--bg);
}
.cal-cell.is-idle { border-color: var(--border-soft); }
.cal-cell.is-out { border: 0; background: transparent; min-height: 44px; }
.cal-cell[aria-pressed="true"] { border-color: var(--line-3); background: var(--fill-2); }
.cal-cell.is-today { box-shadow: inset 0 0 0 1px var(--line-2); }
.cal-cell.is-today .cal-day { color: var(--fg); }
.cal-day { font-family: var(--font-mono); font-size: 10px; color: var(--meta); }
.cal-cell.has-data .cal-day { color: var(--fg-2); }
.cal-min { font-family: var(--font-mono); font-size: 10px; color: var(--fg-2); }
.cal-bar { position: absolute; left: 0; right: 0; bottom: 0; background: color-mix(in oklch, var(--fg) 22%, transparent); }
.cal-cell[aria-pressed="true"] .cal-bar { background: color-mix(in oklch, var(--fg) 44%, transparent); }

/* ─────────────────────────── 动效 ─────────────────────────── */
@keyframes fade-in { from { opacity: 0; } to { opacity: 1; } }
@keyframes pop-in { from { opacity: 0; transform: translateY(6px) scale(0.985); } to { opacity: 1; transform: none; } }
@keyframes toast-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes toast-out { to { opacity: 0; transform: translateY(6px); } }
@keyframes view-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
@keyframes row-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
@keyframes spin { to { transform: rotate(360deg); } }
@keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.55; } }

.view.enter { animation: view-in 220ms var(--ease-standard) both; }
.stagger > * { animation: row-in 240ms var(--ease-standard) both; }
.stagger > *:nth-child(1) { animation-delay: 0ms; }
.stagger > *:nth-child(2) { animation-delay: 22ms; }
.stagger > *:nth-child(3) { animation-delay: 44ms; }
.stagger > *:nth-child(4) { animation-delay: 66ms; }
.stagger > *:nth-child(5) { animation-delay: 88ms; }
.stagger > *:nth-child(6) { animation-delay: 110ms; }
.stagger > *:nth-child(n+7) { animation-delay: 130ms; }
.spinner { width: 14px; height: 14px; border-radius: var(--radius-pill); border: 1.5px solid var(--fill-3); border-top-color: var(--fg); animation: spin 700ms linear infinite; }
.pulsing { animation: pulse 1.6s ease-in-out infinite; }
.enter-lift { transition: transform var(--motion-base) var(--ease-standard), border-color var(--motion-base) var(--ease-standard), background var(--motion-base) var(--ease-standard); }
.enter-lift:hover { transform: translateY(-1px); }

@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; animation-iteration-count: 1 !important; transition-duration: 0.01ms !important; }
  .enter-lift:hover { transform: none; }
}

/* ─────────────────────────── 响应式 ─────────────────────────── */
@media (max-width: 1180px) { .content { padding-inline: var(--space-6); } .topbar { padding-inline: var(--space-6); } }
@media (max-width: 1040px) {
  .grid-play, .split { grid-template-columns: minmax(0, 1fr); }
  .grid-4 { grid-template-columns: repeat(2, minmax(0, 1fr)); }
}
@media (max-width: 900px) {
  .sidebar { flex-basis: 60px; width: 60px; padding-inline: var(--space-2); }
  .sidebar .nav-text, .sidebar .nav-group, .sidebar .account-text, .sidebar .build-note, .sidebar .lang-switch { display: none; }
  .nav-item { justify-content: center; padding: 0; }
  .account { justify-content: center; padding: var(--space-2); }
  .grid-2, .grid-3 { grid-template-columns: minmax(0, 1fr); }
  .topbar { flex-wrap: wrap; }
}
@media (max-width: 620px) {
  .content { padding: var(--space-4) var(--space-4) var(--space-8); }
  .topbar { padding: var(--space-3) var(--space-4); }
  .grid-4 { grid-template-columns: minmax(0, 1fr); }
  .toasts { left: var(--space-4); right: var(--space-4); width: auto; }

/* ───────────────────────── Toast ───────────────────────── */
function toast(title, desc, kind) {
  const host = $('#toasts');
  const ic = kind === 'ok' ? 'check' : kind === 'err' ? 'alert' : kind === 'warn' ? 'alert' : kind === 'info' ? 'info' : 'info';
  const el = document.createElement('div');
  el.className = 'toast ' + (kind || 'info');
  el.innerHTML = ico(ic) + '<div class="t-body"><div class="t-title">' + esc(title) + '</div>' +
    (desc ? '<div class="t-desc">' + esc(desc) + '</div>' : '') + '</div>';
  host.appendChild(el);
  setTimeout(() => { el.classList.add('leaving'); setTimeout(() => el.remove(), 220); }, 3600);
  while (host.children.length > 3) host.removeChild(host.firstChild);
}

/* ───────────────────────── 模态框 / 抽屉（Esc / 焦点陷阱 / 焦点归还） ───────────────────────── */
let modalCtx = null;
function openModal(spec) {
  closeModal(true);
  const trigger = document.activeElement;
  const host = $('#overlayHost');
  const labelled = 'modalTitle-' + Math.random().toString(36).slice(2, 7);
  const head = '<div class="modal-head"><div>' +
    '<h2 class="modal-title" id="' + labelled + '">' + esc(spec.title) + '</h2>' +
    (spec.desc ? '<p class="modal-desc"' + (spec.descId ? ' id="' + spec.descId + '"' : '') + '>' + esc(spec.desc) + '</p>' : '') +
    '</div>' + (spec.headExtra || '') + '</div>';
  const inner = head + '<div class="modal-body"' + (spec.bodyId ? ' id="' + spec.bodyId + '"' : '') + '>' + spec.body + '</div>' +
    '<div class="modal-foot">' + spec.foot + '</div>';
  host.innerHTML = spec.kind === 'drawer'
    ? '<div class="scrim right" data-scrim><aside class="drawer" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="' + labelled + '">' + inner + '</aside></div>'
    : '<div class="scrim" data-scrim><div class="modal" role="dialog" aria-modal="true" tabindex="-1" aria-labelledby="' + labelled + '">' + inner + '</div></div>';
  modalCtx = { trigger: trigger, spec: spec, onSubmit: spec.onSubmit || null };
  const scrim = $('[data-scrim]', host);
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) closeModal(); });
  host.addEventListener('keydown', modalKeys);
  document.addEventListener('focusin', trapFocus);
  /* 初始焦点：表单类模态框先给第一个字段；确认类模态框给主操作，但绝不停留在危险按钮上。
     抽屉打开时焦点给标题，避免直接落在第一行的启停开关上。 */
  const box = $('.modal, .drawer', host);
  const field = $$('.modal-body input, .modal-body select, .modal-body textarea', host).filter((n) => !n.disabled)[0];
  const safePrimary = $$('.modal-foot .btn-primary', host).filter((n) => !n.classList.contains('btn-danger'))[0];
  const anySafe = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', box)
    .filter((n) => !n.disabled && !n.classList.contains('btn-danger'))[0];
  if (spec.kind === 'drawer') box.focus(); else (field || safePrimary || anySafe || box).focus();
}
function modalKeys(e) {
  if (e.key === 'Escape') { e.stopPropagation(); closeModal(); }
  if (e.key === 'Enter' && modalCtx && modalCtx.onSubmit && e.target.tagName !== 'TEXTAREA' && e.target.tagName !== 'BUTTON') {
    e.preventDefault(); modalCtx.onSubmit($('#overlayHost'));
  }
}
function trapFocus(e) {
  if (!modalCtx) return;
  const box = $('.modal, .drawer', $('#overlayHost'));
  if (box && !box.contains(e.target)) {
    const f = $$('button, [href], input, select, textarea, [tabindex]:not([tabindex="-1"])', box).filter((n) => !n.disabled);
    if (f.length) f[0].focus();
  }
}
function closeModal(silent) {
  if (!modalCtx) return;
  const trigger = modalCtx.trigger;
  $('#overlayHost').innerHTML = '';
  $('#overlayHost').removeEventListener('keydown', modalKeys);
  document.removeEventListener('focusin', trapFocus);
  modalCtx = null;
  /* 触发元素可能已被重渲染替换（抽屉改动计数后列表会重绘），按 data-od-id 找回来 */
  if (!silent && trigger) {
    let back = document.contains(trigger) ? trigger : null;
    if (!back && trigger.dataset && trigger.dataset.odId) back = document.querySelector('[data-od-id="' + trigger.dataset.odId + '"]');
    if (back) back.focus();
    else { const root = $('#viewRoot'); if (root) root.focus({ preventScroll: true }); }
  }
}
const closeModalSoft = () => closeModal();

let palIdx = 0, palItems = [];
function openPalette() {
  const host = $('#overlayHost');
  closeModal(true);
  const trigger = document.activeElement;
  host.innerHTML = '<div class="scrim" data-scrim><div class="palette" role="dialog" aria-modal="true" aria-label="快速操作">' +

    '<div class="palette-list" id="palList" role="listbox" aria-label="命令列表"></div>' +
    '<div class="palette-foot"><span><span class="kbd">↑</span> <span class="kbd">↓</span> 选择</span><span><span class="kbd">Enter</span> 执行</span><span><span class="kbd">Esc</span> 关闭</span></div></div></div>';
  modalCtx = { trigger: trigger, spec: { title: '快速操作' } };
  const scrim = $('[data-scrim]', host);
  scrim.addEventListener('mousedown', (e) => { if (e.target === scrim) closeModal(); });
  host.addEventListener('keydown', paletteKeys);
  document.addEventListener('focusin', trapFocus);
  renderPalette('');
  $('#palInput').addEventListener('input', (e) => renderPalette(e.target.value));
  $('#palInput').focus();
}
function renderPalette(q) {
  const query = q.trim().toLowerCase();
  palItems = paletteCommands().filter((c) => !query || c.label.toLowerCase().indexOf(query) >= 0);
  palIdx = 0;
  const groups = [];
  palItems.forEach((c) => { if (groups.indexOf(c.group) < 0) groups.push(c.group); });
  $('#palList').innerHTML = palItems.length ? groups.map((g) =>
    '<div class="palette-group">' + esc(g) + '</div>' + palItems.map((c, i) => c.group === g
      ? '<button class="palette-item" role="option" aria-selected="' + (i === palIdx) + '" data-pal="' + i + '">' + ico(c.icon) + '<span>' + esc(c.label) + '</span><span class="hint">' + esc(c.hint) + '</span></button>'
      : '').join('')).join('') : '<div class="state" style="border:0;background:transparent"><p class="s-title">没有匹配的命令</p><p class="s-desc">换个关键词，或按 Esc 关闭。</p></div>';
  $$('.palette-item').forEach((b) => b.addEventListener('click', () => runPalette(+b.dataset.pal)));
}
function paletteKeys(e) {
  if (e.key === 'Escape') { closeModal(); return; }
  if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    e.preventDefault();
    if (!palItems.length) return;
    palIdx = (palIdx + (e.key === 'ArrowDown' ? 1 : palItems.length - 1)) % palItems.length;
    $$('.palette-item').forEach((b, i) => b.setAttribute('aria-selected', String(i === palIdx)));
    const list = $('#palList');
    const cur = $$('.palette-item')[palIdx];
    if (cur && list) {
      const top = cur.offsetTop, bottom = top + cur.offsetHeight;
      if (top < list.scrollTop) list.scrollTop = top - 4;
      else if (bottom > list.scrollTop + list.clientHeight) list.scrollTop = bottom - list.clientHeight + 4;
    }
  }
  if (e.key === 'Enter') { e.preventDefault(); runPalette(palIdx); }
}
function runPalette(i) {
  const cmd = palItems[i]; if (!cmd) return;
  closeModal(true);
  if (cmd.id === 'launch') return ACTIONS.launch();
  if (cmd.id === 'stop') return ACTIONS.stop();
  if (cmd.id === 'check-update') { go('settings'); return setTimeout(() => ACTIONS['check-update'](), 260); }
  if (cmd.id === 'open-logs') return toast('已请求打开日志目录', '原型内不会真实打开目录（模拟）', 'info');
  if (cmd.id === 'toggle-offline') return ACTIONS['toggle-offline']();
  const v = cmd.id;
  if (v === state.view) { toast('已经在「' + PAGES[v][0] + '」', null, 'info'); return; }
  go(v);
}

const VIEWS = {};
const ACTIONS = {};
let lastFocus = null;

function go(view, opts) {
  if (!PAGES[view]) view = 'home';
  state.view = view; store.set('view', view);
  render(opts);
  const el = $('#viewRoot');
  el.scrollTop = 0;
  el.focus({ preventScroll: true });
}

function navHTML() {
  return NAV.map((g) =>
    '<div class="nav-group">' + esc(g.group) + '</div>' + g.items.map((it) => {
      const c = it.count ? it.count() : null;
      return '<button class="nav-item" data-act="go" data-view="' + it.id + '"' + (state.view === it.id ? ' aria-current="page"' : '') + '>' +
        ico(it.icon) + '<span class="nav-text">' + esc(it.label) + '</span>' +
        (c ? '<span class="nav-count num">' + c + '</span>' : '') + '</button>';
    }).join('')).join('');
}

function render(opts) {
  const o = opts || {};
  const active = document.activeElement;
  const keep = o.keepFocus && active && active.id ? { id: active.id, start: active.selectionStart, end: active.selectionEnd } : null;

  $('#nav').innerHTML = navHTML();
  $('#pageTitle').textContent = PAGES[state.view][0];
  $('#pageSub').textContent = PAGES[state.view][1];
  const root = $('#viewRoot');
  root.innerHTML = (VIEWS[state.view] || (() => ''))();
  root.firstElementChild && root.firstElementChild.classList.add('enter');
  if (state.view === 'stats') layoutTreemap();

  if (keep) {
    const el = document.getElementById(keep.id);
    if (el) { el.focus(); try { el.setSelectionRange(keep.start, keep.end); } catch (e) { /* number input */ } }
  }
  if (!o.keepFocus && !o.noFocus) { /* 保持滚动位置 */ }
  syncRangeFills(root);
}

function syncRangeFills(root) {
  $$('input[type="range"]', root).forEach((r) => {
    const pct = ((+r.value - +r.min) / (+r.max - +r.min)) * 100;
    r.style.setProperty('--range-fill', pct + '%');
  });
}

/* ───────────────────────── 计时器：运行时长与下载进度 ───────────────────────── */
let ticker = null;
function startTicker() {
  if (ticker) return;
  ticker = setInterval(() => {
    const t = $('[data-elapsed]');
    if (t && state.launch.phase === 'running') t.textContent = elapsed(Date.now() - state.launch.startedAt);
    let changed = false;
    state.tasks.forEach((task) => {
      if (task.state !== 'downloading') return;
      const next = Math.min(100, task.pct + (task.pct > 80 ? 1 : 2));
      if (next === task.pct) return;
      task.pct = next; changed = true;
      if (next >= 100) { task.state = 'completed'; task.eta = ''; }
      const bar = $('[data-task-bar="' + task.id + '"]');
      if (bar) { bar.style.width = next + '%'; bar.parentElement.classList.toggle('accent', task.state === 'downloading'); }
      const pct = $('[data-task-pct="' + task.id + '"]');
      if (pct) pct.textContent = next >= 100 ? '已完成' : next + '%';
    });
    if (changed && state.view === 'home') { const m = $('[data-mini-tasks]'); if (m) m.innerHTML = VIEWS.miniTasks(); }
  }, 2000);
}

/* ───────────────────────── 全局事件 ───────────────────────── */
function onClick(e) {
  const el = e.target.closest('[data-act]');
  if (!el) return;
  const act = el.dataset.act;
  if (!ACTIONS[act]) return;
  if (el.tagName === 'BUTTON' && el.disabled) return;
  ACTIONS[act](el, e);
}
function onInput(e) {
  const el = e.target.closest('[data-input]');
  if (!el) return;
  const key = el.dataset.input;
  if (key === 'instQ') { state.filters.instQ = el.value; render({ keepFocus: true }); }
  if (key === 'contentQ') { state.filters.contentQ = el.value; render({ keepFocus: true }); }
  if (key === 'worldQ') { state.filters.worldQ = el.value; render({ keepFocus: true }); }
  if (key === 'serverQ') { state.filters.serverQ = el.value; render({ keepFocus: true }); }
  if (key === 'modQ') { state.modQ = el.value; paintDrawer(true); }
  if (key === 'mem') {
    state.settings.mem = +el.value;
    el.style.setProperty('--range-fill', ((el.value - el.min) / (el.max - el.min)) * 100 + '%');
    const out = $('#memOut'); if (out) out.textContent = (el.value / 1024) + ' GB';
  }
}
function onChange(e) {
  const chk = e.target.closest('[data-check]');
  if (chk) { ACTIONS[chk.dataset.check](chk, e); return; }
  const dt = e.target.closest('[data-range-date]');
  if (dt) {
    if (dt.dataset.rangeDate === 'from') state.stats.from = dt.value;
    else state.stats.to = dt.value;
    ACTIONS['stats-validate']();
    render({ keepFocus: true });
  }
}
/* 树状图方块的数据读出：悬停或聚焦时把该块的明细写到读出条 */
function onHover(e) {
  const out = $('#tmReadout');
  if (!out || !out.lastElementChild) return;
  const el = e.target.closest ? e.target.closest('[data-readout]') : null;
  out.lastElementChild.textContent = el ? el.dataset.readout : out.dataset.default;
}
function onKeydown(e) {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); openPalette(); }
}

/* ───────────────────────── 初始化 ───────────────────────── */
function init() {
  document.addEventListener('click', onClick);
  document.addEventListener('input', onInput);
  document.addEventListener('change', onChange);
  document.addEventListener('keydown', onKeydown);
  document.addEventListener('mouseover', onHover);
  document.addEventListener('mouseout', onHover);
  document.addEventListener('focusin', onHover);
  document.addEventListener('focusout', onHover);
  $('#paletteBtn').addEventListener('click', openPalette);
  $('#refreshBtn').addEventListener('click', () => ACTIONS['refresh-all']());
  $('#accountBtn').addEventListener('click', () => ACTIONS['add-account']());
  ['#winMin', '#winMax', '#winClose'].forEach((s) => $(s).addEventListener('click', () => toast('窗口控制不可用', '原型内不会最小化、最大化或关闭窗口', 'info')));
  $$('.lang-switch button').forEach((b) => b.addEventListener('click', () => {
    $$('.lang-switch button').forEach((x) => x.setAttribute('aria-pressed', String(x === b)));
    if (b.dataset.lang === 'en') toast('原型仅提供中文界面', '语言切换在正式版中由 i18n 词典驱动', 'warn');
  }));
  if (!PAGES[state.view] || !VIEWS[state.view]) state.view = 'home';
  if (!currentInstance() && DB.instances.length) state.instance = DB.instances[0].id;
  render();
  startTicker();
}

  return '<span class="sig' + cls + '" aria-hidden="true">' + [0, 1, 2].map((i) => '<i class="' + (i < on ? 'on' : '') + '"></i>').join('') + '</span>';
};

  const list = state.servers.filter((s) => !q || (s.name + s.host).toLowerCase().indexOf(q) >= 0);
  const rows = list.map((s) =>
    '<div class="list-row" data-od-id="server-' + s.id + '">' +
      '<span class="thumb thumb-lg">' + ico('servers', 21) + '</span>' +
      '<span class="grow stack" style="gap:4px">' +
        '<span class="row gap-2" style="flex-wrap:wrap"><span class="row-title">' + esc(s.name) + '</span>' +
        (s.fav ? chip('已收藏', 'chip-warn', 'star') : '') + chip(s.ver) + '</span>' +
        '<span class="row-sub num">' + esc(s.host) + (s.port !== 25565 ? ':' + s.port : '') + '</span>' +
      '</span>' +
      '<span class="stack" style="gap:4px;align-items:flex-end;min-width:96px">' +
        '<span class="row gap-2">' + sig(s.ping) +
        '<span class="num" style="font-size:var(--text-sm)">' + (s.ping === null ? '离线' : s.ping + ' ms') + '</span></span>' +
        '<span class="meta">' + (s.online ? s.players.toLocaleString('en-US') + ' / ' + s.cap.toLocaleString('en-US') + ' 在线' : '—') + '</span>' +
      '</span>' +
      '<span class="row-actions">' +
        '<button class="icon-btn" data-act="server-fav" data-id="' + s.id + '" aria-pressed="' + s.fav + '" aria-label="收藏 ' + esc(s.name) + '">' + ico('star') + '</button>' +
        '<button class="btn btn-secondary btn-sm" data-act="server-ping" data-id="' + s.id + '">刷新延迟</button>' +
        '<button class="icon-btn danger" data-act="server-del" data-id="' + s.id + '" aria-label="删除 ' + esc(s.name) + '">' + ico('trash') + '</button>' +
      '</span></div>').join('');
  return '<div class="view">' + pageCard({
    id: 'servers', title: '收藏的服务器', hint: '延迟与在线人数为模拟值，不会真实连接服务器',
    tools: '<div class="search">' + ico('search') + '<input class="input" id="serverQ" data-input="serverQ" type="search" value="' + esc(state.filters.serverQ) + '" placeholder="搜索服务器…" aria-label="搜索服务器"></div>' +
      '<button class="btn btn-primary btn-sm" data-act="server-add" data-od-id="cta-add-server">' + ico('plus', 13) + '<span>添加服务器</span></button>',
    body: list.length ? '<div class="list stagger">' + rows + '</div>'
      : stateBlock({ icon: 'servers', title: '还没有添加服务器', desc: '点击右上角「添加服务器」收藏第一个服务器。' })
  }) + '</div>';
};

/* ───────────────────────── 视图：内容中心 ───────────────────────── */
VIEWS.content = function () {
  const f = state.filters;
  const groups = [['mods', '模组'], ['modpacks', '整合包'], ['shaders', '光影'], ['resourcepacks', '资源包']];
  const all = state.content[f.tab] || [];
  const q = f.contentQ.toLowerCase();
  const list = all.filter((c) => !q || (c.name + c.author + c.desc).toLowerCase().indexOf(q) >= 0);
  const inst = currentInstance();

  const card = (c) => {
    const btn = c.state === 'installed'
      ? '<span class="chip chip-ok">' + ico('check', 11) + '已安装</span>'
      : c.state === 'installing'
        ? '<button class="btn btn-secondary btn-sm" disabled>' + ico('refresh', 13) + '<span data-inst-pct="' + c.id + '">安装中 ' + (c.pct || 0) + '%</span></button>'
        : '<button class="btn btn-secondary btn-sm" data-act="content-install" data-id="' + c.id + '">' + ico('downloads', 13) + '<span>安装</span></button>';
    return '<article class="card enter-lift" data-od-id="content-' + c.id + '">' +
      '<div class="row-between gap-3" style="align-items:flex-start">' +
        '<div class="grow" style="min-width:0">' +
          '<h3 class="card-title anywhere">' + esc(c.name) + '</h3>' +
          '<p class="card-hint" style="margin-top:2px">作者：' + esc(c.author) + '</p>' +
        '</div>' + btn +
      '</div>' +
      '<p class="fg2" style="font-size:var(--text-xs);line-height:1.75;margin-top:10px">' + esc(c.desc) + '</p>' +
      '<div class="row gap-2" style="flex-wrap:wrap;margin-top:12px">' + c.tags.map((t) => '<span class="tag">' + esc(t) + '</span>').join('') + '</div>' +
      '</article>';
  };

  let body;
  if (state.offline) {
    body = errorBlock({
      title: '内容加载失败', desc: '没能从内容源取回数据。这通常是网络或内容源暂时不可用，稍后重试即可。',
      extra: '当前处于离线模式，所有请求都会失败。', act: 'content-retry', tech: 'GET https://api.modrinth.com/v2/search?query=\n→ net::ERR_INTERNET_DISCONNECTED（模拟）'
    });
  } else if (!list.length) {
    body = stateBlock({ icon: 'search', title: '没有找到匹配的内容', desc: '换个关键词试试，或切换分类标签。' });
  } else {
    body = '<div class="grid-3 stagger">' + list.map(card).join('') + '</div>';
  }

  return '<div class="view">' + pageCard({
    id: 'content', title: '内容库', hint: '示例条目 · 项目名与作者取自真实项目',
    tools: '<div class="search">' + ico('search') + '<input class="input" id="contentQ" data-input="contentQ" type="search" value="' + esc(f.contentQ) + '" placeholder="搜索内容…" aria-label="搜索内容"></div>',
    body: '<div class="row-between gap-3" style="flex-wrap:wrap;margin-bottom:14px">' +
      '<div class="seg" role="group" aria-label="内容分类">' + groups.map((g) =>
        '<button data-act="content-tab" data-value="' + g[0] + '" aria-pressed="' + (f.tab === g[0]) + '">' + g[1] + '</button>').join('') + '</div>' +
      '<div class="row gap-2">' + chip(inst ? '目标实例 · ' + inst.name : '未按实例过滤') + chip('来源 · Modrinth') + '</div>' +
      '</div>' + body
  }) + '</div>';
};

/* ───────────────────────── 视图：下载 ───────────────────────── */
VIEWS.downloads = function () {
  const f = state.filters;
  let versionsBody;
  if (state.offline) {
    versionsBody = errorBlock({
      title: '无法获取可下载版本', desc: '版本列表没有取回来。已有下载任务不受影响，稍后重试即可。',
      extra: '当前处于离线模式，版本源请求失败。', act: 'dl-retry',
      tech: 'GET https://launchermeta.mojang.com/mc/game/version_manifest_v2.json\n→ net::ERR_INTERNET_DISCONNECTED（模拟）'
    });
  } else {
    const list = DB.versions.filter((v) => f.dl === 'all' || v.type === f.dl);
    versionsBody = list.length
      ? '<div class="list">' + list.map((v) =>
        '<div class="list-row" data-od-id="version-' + v.id + '">' +
          '<span class="thumb">' + ico(v.type === 'snapshot' ? 'zap' : 'cube') + '</span>' +
          '<span class="grow stack" style="gap:3px"><span class="row gap-2">' +
            '<span class="row-title num">' + esc(v.id) + '</span>' +
            chip(v.type === 'snapshot' ? '快照' : '正式版', v.latest ? 'chip-accent' : '') +
            (v.latest ? chip('最新') : '') + '</span>' +
          '<span class="row-sub num">' + esc(v.date) + ' · ' + esc(v.size) + '</span></span>' +
          '<span class="row-actions">' + (v.installed
            ? '<span class="chip chip-ok">' + ico('check', 11) + '已安装</span>'
            : '<button class="btn btn-secondary btn-sm" data-act="dl-start" data-id="' + v.id + '">' + ico('downloads', 13) + '<span>下载</span></button>') +
          '</span></div>').join('') + '</div>'
      : stateBlock({ icon: 'search', title: '当前筛选下没有版本', desc: '换个筛选条件看看。' });
  }

  const tasksBody = state.tasks.length
    ? '<div class="list">' + state.tasks.map((t) => taskRow(t, false)).join('') + '</div>'
    : stateBlock({ icon: 'downloads', title: '暂无下载任务', desc: '从上方版本列表或内容中心发起下载。' });

  return '<div class="view">' +
    pageCard({
      id: 'download-versions', title: '可用版本', hint: '版本号与发布日期取自 Minecraft 官方版本清单；体积为模拟值',
      tools: '<div class="seg" role="group" aria-label="版本筛选">' +
        [['all', '全部'], ['release', '正式版'], ['snapshot', '快照']].map((p) =>
          '<button data-act="filter-dl" data-value="' + p[0] + '" aria-pressed="' + (f.dl === p[0]) + '">' + p[1] + '</button>').join('') + '</div>' +
        '<button class="btn btn-secondary btn-sm" data-act="dl-retry">' + ico('refresh', 13) + '<span>重新获取</span></button>',
      body: versionsBody
    }) +
    pageCard({
      id: 'download-tasks', title: '下载任务', hint: '进度、速率与剩余时间为模拟值',
      tools: '<button class="btn btn-ghost btn-sm" data-act="task-clear">清除已完成</button>',
      body: tasksBody + '<p class="card-hint" style="margin-top:12px">任务区与版本列表相互独立：版本源请求失败时，这里的任务不会被清空。</p>'
    }) + '</div>';
};

/* ───────────────────────── 视图：新闻 ───────────────────────── */
VIEWS.news = function () {
  const st = state.newsState;
  const statusChip = st === 'live' ? chip('已同步官方最新', 'chip-ok', 'check')
    : st === 'cached' ? chip('离线缓存', 'chip-warn', 'clock')
      : st === 'error' ? chip('加载失败', 'chip-danger', 'alert')
        : chip('尚未验证', 'chip-warn', 'clock');
  let body;
  if (st === 'error') {
    body = errorBlock({
      title: '新闻加载失败', desc: '新闻加载失败，请检查网络后重试。',
      extra: '错误码：net::ERR_INTERNET_DISCONNECTED（模拟）', act: 'news-retry',
      tech: 'GET https://www.minecraft.net/en-us/feeds/community-content/rss\n→ 请求失败（模拟）'
    });
  } else if (!state.news.length) {
    body = stateBlock({ icon: 'news', title: '暂无新闻', desc: '官方源暂无内容，稍后再试。', action: '<button class="btn btn-secondary btn-sm" data-act="news-refresh">刷新</button>' });
  } else {
    body = '<div class="stack gap-3 stagger">' + state.news.map((n) =>
      '<article class="card enter-lift" data-od-id="news-' + n.id + '">' +
      '<div class="row gap-2" style="flex-wrap:wrap">' + chip(n.cat) + '<span class="meta">' + esc(n.time) + '</span></div>' +
      '<h3 class="card-title" style="margin-top:10px;font-size:var(--text-base)">' + esc(n.title) + '</h3>' +
      '<p class="fg2" style="font-size:var(--text-xs);line-height:1.8;margin-top:6px">' + esc(n.body) + '</p>' +
      '<div class="row gap-2" style="margin-top:12px">' +
      '<button class="btn btn-secondary btn-sm" data-act="news-open" data-id="' + n.id + '">' + ico('news', 13) + '<span>查看详情</span></button>' +
      '<button class="btn btn-ghost btn-sm" data-act="news-link" data-id="' + n.id + '">查看原文' + ico('external', 12) + '</button>' +
      '</div></article>').join('') + '</div>';
  }
  return '<div class="view">' + pageCard({
    id: 'news', title: '官方动态', hint: '示例内容 · 原型不联网，文章为本地示例',
    tools: statusChip + '<span class="meta">' + (state.newsVerified ? '最后验证 ' + hhmm(now()) : '尚未验证 · 日期已隐藏') + '</span>' +
      '<button class="btn btn-secondary btn-sm" data-act="news-refresh">' + ico('refresh', 13) + '<span>刷新</span></button>',
    body: body
  }) + '</div>';
};

/* ───────────────────────── 游戏时长：游玩记录（模拟，固定种子） ───────────────────────── */
function mulberry32(seed) {
  let a = seed;
  return function () {
    a |= 0; a = a + 0x6D2B79F5 | 0;
    let t = Math.imul(a ^ a >>> 15, 1 | a);
    t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t;
    return ((t ^ t >>> 14) >>> 0) / 4294967296;
  };
}
const DAY_MS = 86400000;
const startOfDay = (d) => new Date(d.getFullYear(), d.getMonth(), d.getDate());
const addDays = (d, n) => new Date(d.getFullYear(), d.getMonth(), d.getDate() + n);
const pad2 = (n) => String(n).padStart(2, '0');
const ymd = (d) => d.getFullYear() + '-' + pad2(d.getMonth() + 1) + '-' + pad2(d.getDate());
const parseYmd = (s) => { const p = String(s || '').split('-'); return p.length === 3 && p[0].length === 4 ? new Date(+p[0], +p[1] - 1, +p[2]) : null; };
const mdLabel = (ds) => { const p = String(ds).split('-'); return (+p[1]) + ' 月 ' + (+p[2]) + ' 日'; };
const INST_STYLE = {
  'fabric-1215': { name: '生电整合 · 1.21.5', color: 'var(--accent)' },
  'vanilla-1215': { name: '原版 1.21.5', color: 'var(--info)' },
  'forge-1201': { name: '机械动力 · 1.20.1', color: 'var(--success)' },
  'snap-25w14a': { name: '快照测试', color: 'var(--warn)' }
};
function fmtDur(min) {
  const m = Math.round(min), h = Math.floor(m / 60), mm = m % 60;
  if (!h) return mm + ' 分';
  return h + ' 小时' + (mm ? ' ' + mm + ' 分' : '');
}
function fmtShort(min) {
  const m = Math.round(min), h = Math.floor(m / 60), mm = m % 60;
  return h ? h + 'h' + (mm ? pad2(mm) : '') : mm + 'm';
}
const RECORD_DAYS = 119;
const SESSIONS = (function () {
  const rnd = mulberry32(20261013);
  const out = [];
  const today = startOfDay(new Date());
  const pool = ['fabric-1215', 'fabric-1215', 'fabric-1215', 'forge-1201', 'forge-1201', 'vanilla-1215', 'snap-25w14a'];
  for (let d = RECORD_DAYS; d >= 0; d--) {
    const day = addDays(today, -d);
    const dow = day.getDay();
    const weekend = dow === 0 || dow === 6;
    if (rnd() > (weekend ? 0.74 : 0.42) + (d < 16 ? 0.14 : 0)) continue;
    const n = 1 + (rnd() < (weekend ? 0.46 : 0.24) ? 1 : 0);
    for (let k = 0; k < n; k++) {
      const inst = pool[Math.floor(rnd() * pool.length)];
      const roll = rnd();
      const minutes = Math.round(roll < 0.28 ? 18 + rnd() * 42 : roll < 0.78 ? 70 + rnd() * 80 : 160 + rnd() * 150);
      out.push({ date: ymd(day), ts: day.getTime(), inst: inst, minutes: minutes });
    }
  }
  return out;
})();
const DAY_TOTAL = SESSIONS.reduce((m, x) => { m[x.date] = (m[x.date] || 0) + x.minutes; return m; }, {});

function statsBounds() {
  const s = state.stats;
  const today = startOfDay(new Date());
  if (s.range === 'week') { const from = addDays(today, -((today.getDay() + 6) % 7)); return { from: from, to: addDays(from, 6), label: '本周' }; }
  if (s.range === '7d') return { from: addDays(today, -6), to: today, label: '近 7 天' };
  if (s.range === '30d') return { from: addDays(today, -29), to: today, label: '近 30 天' };
  if (s.range === 'custom') {
    const f = parseYmd(s.from), t = parseYmd(s.to);
    if (!f || !t || f > t) return null;
    return { from: f, to: t, label: mdLabel(s.from) + ' – ' + mdLabel(s.to) };
  }
  return { from: new Date(today.getFullYear(), today.getMonth(), 1), to: new Date(today.getFullYear(), today.getMonth() + 1, 0), label: '本月' };
}
function statsSessions() {
  const b = statsBounds();
  if (!b) return [];
  const from = b.from.getTime(), to = b.to.getTime() + DAY_MS - 1;
  const day = state.stats.day;
  return SESSIONS.filter((x) => x.ts >= from && x.ts <= to && (!day || x.date === day));
}
function statsGroups(list) {
  const map = {};
  list.forEach((x) => { (map[x.inst] = map[x.inst] || []).push(x); });
  return Object.keys(map).map((k) => ({
    inst: k,
    name: (INST_STYLE[k] || {}).name || k,
    color: (INST_STYLE[k] || {}).color || 'var(--fg)',
    sessions: map[k].slice().sort((a, b) => b.minutes - a.minutes),
    total: map[k].reduce((s, x) => s + x.minutes, 0)
  })).sort((a, b) => b.total - a.total);
}

/* ── 平方化树状图布局（Bruls et al. squarified treemap） ── */
function squarify(items, x, y, w, h) {
  const out = [];
  const list = items.filter((it) => it.v > 0).slice().sort((a, b) => b.v - a.v);
  const total = list.reduce((s, it) => s + it.v, 0);
  if (!total || w <= 1 || h <= 1) return out;
  const scale = (w * h) / total;
  const queue = list.map((it) => ({ it: it, a: it.v * scale }));
  let rx = x, ry = y, rw = w, rh = h;
  while (queue.length) {
    const vertical = rw >= rh;
    const side = Math.max(1, vertical ? rh : rw);
    const row = [];
    let rowArea = 0, best = Infinity;
    while (queue.length) {
      const cand = queue[0];
      const area = rowArea + cand.a;
      const len = Math.max(1, area / side);
      let worst = 0;
      for (let i = 0; i <= row.length; i++) {
        const a = i < row.length ? row[i].a : cand.a;
        const cl = Math.max(1, a / len);
        worst = Math.max(worst, len / cl, cl / len);
      }
      if (row.length && worst > best) break;
      row.push(queue.shift()); rowArea = area; best = worst;
    }
    const len = Math.max(1, rowArea / side);
    let off = 0;
    row.forEach((c) => {
      const cl = c.a / len;
      out.push(vertical
        ? { it: c.it, x: rx, y: ry + off, w: len, h: cl }
        : { it: c.it, x: rx + off, y: ry, w: cl, h: len });
      off += cl;
    });
    if (vertical) { rx += len; rw -= len; } else { ry += len; rh -= len; }
    if (rw < 1 || rh < 1) break;
  }
  return out;
}

let tmLastW = 0, tmLastH = 0, tmObserver = null, tmRaf = 0;
function layoutTreemap() {
  const host = $('#treemap');
  if (tmObserver) { tmObserver.disconnect(); tmObserver = null; }
  if (!host) { tmLastW = 0; tmLastH = 0; return; }
  /* 高和宽都要盯着：只比较宽度的话，「宽度已就位、高度还是 0」的首帧状态永远不会触发重排 */
  if (typeof ResizeObserver === 'function') {
    tmObserver = new ResizeObserver(() => {
      const el = $('#treemap');
      if (el && (Math.abs(el.clientWidth - tmLastW) > 8 || Math.abs(el.clientHeight - tmLastH) > 8)) layoutTreemap();
    });
    tmObserver.observe(host);
  }
  const groups = statsGroups(statsSessions());
  if (!groups.length) {
    host.innerHTML = '<div class="state" style="position:absolute;inset:0;justify-content:center">' + ico('clock', 22) +
      '<p class="s-title">这段时间没有游玩记录</p><p class="s-desc">换一个时间范围，或清除日期筛选后再看。</p></div>';
    return;
  }
  /* 尺寸兜底：视图刚插入、预览容器还没完成排版时，clientWidth / clientHeight 会读成 0。
     这里用卡片宽度与 CSS 高度推算，保证图表一定画得出来；下一帧再用真实尺寸重画一次。 */
  const card = host.parentElement;
  const measuredW = host.clientWidth, measuredH = host.clientHeight;
  const exact = measuredW > 0 && measuredH > 0;
  const W = Math.max(260, measuredW || (card && card.clientWidth ? card.clientWidth - 32 : 0) || 720);
  const H = Math.max(220, measuredH || 340);
  tmLastW = measuredW;
  tmLastH = measuredH;
  if (!measuredH) host.style.height = H + 'px';
  const GAP = 2, HEAD = 22;
  const outer = squarify(groups.map((g) => ({ v: g.total, g: g })), 0, 0, W, H);
  let html = '';
  try {
  outer.forEach((o) => {
    const gw = Math.max(4, o.w - GAP), gh = Math.max(4, o.h - GAP);
    const g = o.g;
    const showHead = gh > 56 && gw > 96;
    const bodyH = Math.max(4, gh - (showHead ? HEAD : 0));
    const parts = squarify(g.sessions.map((s) => ({ v: s.minutes, s: s })), 0, 0, gw, bodyH);
    let cells = '';
    parts.forEach((p) => {
      const cw = p.w - GAP, ch = p.h - GAP;
      if (cw < 7 || ch < 7) return;
      const sx = p.it.s;
      cells += '<button type="button" class="tm-cell" data-act="stats-day" data-date="' + sx.date + '"' +
        ' style="left:' + (p.x / gw * 100).toFixed(3) + '%;top:' + (p.y / bodyH * 100).toFixed(3) + '%;width:' + (cw / gw * 100).toFixed(3) + '%;height:' + (ch / bodyH * 100).toFixed(3) + '%"' +
        ' data-readout="' + esc(mdLabel(sx.date) + ' · ' + g.name + ' · ' + fmtDur(sx.minutes)) + '"' +
        ' aria-label="' + esc(mdLabel(sx.date) + ' ' + g.name + ' 游玩 ' + fmtDur(sx.minutes)) + '">' +
        (cw > 78 && ch > 44 ? '<span class="tm-date">' + esc(mdLabel(sx.date)) + '</span>' : '') +
        (cw > 54 && ch > 26 ? '<span class="tm-dur">' + esc(fmtShort(sx.minutes)) + '</span>' : '') +
        '</button>';
    });
    html += '<div class="tm-group" style="left:' + (o.x / W * 100).toFixed(3) + '%;top:' + (o.y / H * 100).toFixed(3) + '%;width:' + (gw / W * 100).toFixed(3) + '%;height:' + (gh / H * 100).toFixed(3) + '%;' +
      '--tm-fill:color-mix(in oklch, ' + g.color + ' 20%, var(--surface));--tm-strong:color-mix(in oklch, ' + g.color + ' 34%, var(--surface))">' +
      (showHead ? '<div class="tm-head"><span class="tm-name">' + esc(g.name) + '</span><span class="tm-total">' + esc(fmtShort(g.total)) + '</span></div>' : '') +
      '<div class="tm-body" style="width:100%;height:' + bodyH.toFixed(1) + 'px">' + cells + '</div></div>';
  });
  } catch (err) {
    html = '<div class="state err" style="position:absolute;inset:0;justify-content:center">' + ico('alert', 22) +
      '<p class="s-title">树状图渲染失败</p><p class="s-desc">' + esc(String((err && err.message) || err)) + '</p></div>';
  }
  host.innerHTML = html;
  /* 首帧尺寸不可信时，下一帧拿到真实尺寸后重画 */
  if (!exact && !tmRaf) {
    tmRaf = requestAnimationFrame(() => {
      tmRaf = 0;
      const el = $('#treemap');
      if (el && el.clientWidth && el.clientHeight && (el.clientWidth !== tmLastW || el.clientHeight !== tmLastH)) layoutTreemap();
    });
  }
}

function calendarModel() {
  const today = startOfDay(new Date());
  const cur = state.stats.month ? parseYmd(state.stats.month + '-01') : new Date(today.getFullYear(), today.getMonth(), 1);
  const y = cur.getFullYear(), m = cur.getMonth();
  const days = new Date(y, m + 1, 0).getDate();
  const lead = (new Date(y, m, 1).getDay() + 6) % 7;
  let max = 0, monthTotal = 0, monthDays = 0;
  const rows = [];
  for (let d = 1; d <= days; d++) {
    const key = ymd(new Date(y, m, d));
    const min = DAY_TOTAL[key] || 0;
    if (min) { monthTotal += min; monthDays++; max = Math.max(max, min); }
    rows.push({ d: d, key: key, min: min, today: key === ymd(today), future: new Date(y, m, d).getTime() > today.getTime() });
  }
  return { y: y, m: m, days: days, lead: lead, rows: rows, max: max, monthTotal: monthTotal, monthDays: monthDays };
}

/* ───────────────────────── 视图：游戏时长 ───────────────────────── */
const STATS_RANGES = [['week', '本周'], ['month', '本月'], ['7d', '近 7 天'], ['30d', '近 30 天'], ['custom', '自定义']];
