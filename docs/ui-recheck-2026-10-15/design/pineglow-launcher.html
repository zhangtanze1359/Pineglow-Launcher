  const customRow = s.range !== 'custom' ? '' :
    '<div class="range-custom">' +
    '<div class="field"><label for="rangeFrom">开始日期</label><input class="input" type="date" id="rangeFrom" data-range-date="from" value="' + esc(s.from) + '" max="' + ymd(startOfDay(new Date())) + '"></div>' +
    '<span class="meta">→</span>' +
    '<div class="field"><label for="rangeTo">结束日期</label><input class="input" type="date" id="rangeTo" data-range-date="to" value="' + esc(s.to) + '" max="' + ymd(startOfDay(new Date())) + '"></div>' +
    (s.err ? '<span class="error" role="alert">' + ico('alert', 13) + esc(s.err) + '</span>' : '<span class="hint">最多可查询 ' + (RECORD_DAYS + 1) + ' 天</span>') +
    '</div>';

  const dayChip = s.day
    ? '<div class="row gap-2" style="flex-wrap:wrap"><span class="chip">' + ico('clock', 11) + '已筛选 ' + esc(mdLabel(s.day)) + '</span>' +
      '<button class="btn btn-ghost btn-sm" data-act="stats-day-clear">清除筛选</button></div>'
    : '';

  const defReadout = b
    ? b.label + ' · 共 ' + fmtDur(total) + ' · ' + list.length + ' 次游玩 · 覆盖 ' + groups.length + ' 个实例'
    : '时间范围无效，请重新选择起止日期';

  const legend = groups.length ? '<div class="tm-legend">' + groups.map((g) =>
    '<div class="tm-legend-row">' +
    '<span class="tm-swatch" style="background:color-mix(in oklch, ' + g.color + ' 58%, var(--surface))"></span>' +
    '<span class="tm-legend-name">' + esc(g.name) + '</span>' +
    '<span class="num" style="color:var(--fg)">' + esc(fmtDur(g.total)) + '</span>' +
    '<span class="meta" style="width:44px;text-align:right">' + Math.round(g.total / (total || 1) * 100) + '%</span>' +
    '<span class="meta" style="width:48px;text-align:right">' + g.sessions.length + ' 次</span>' +
    '</div>').join('') + '</div>' : '';

  const chartCard = pageCard({
    id: 'stats-treemap', title: '时长树状图', hint: '每个方块是一次游玩，面积按时长分配 · 示例数据，仅覆盖最近 ' + (RECORD_DAYS + 1) + ' 天',
    tools: rangeSeg,
    body: customRow + dayChip +
      '<div class="readout" id="tmReadout" data-default="' + esc(defReadout) + '">' + ico('info', 13) + '<span>' + esc(defReadout) + '</span></div>' +
      (b
        ? '<div class="treemap" id="treemap"></div>' + legend
        : stateBlock({ kind: 'err', icon: 'alert', title: '时间范围无效', desc: s.err || '请选择有效的起止日期。' }))
  });

  const cal = calendarModel();
  const calCells = [];
  for (let i = 0; i < cal.lead; i++) calCells.push('<span class="cal-cell is-out"></span>');
  cal.rows.forEach((r) => {
    const sel = s.day === r.key;
    calCells.push(r.min && !r.future
      ? '<button type="button" class="cal-cell has-data' + (r.today ? ' is-today' : '') + '" data-act="stats-day" data-date="' + r.key + '" aria-pressed="' + sel + '"' +
        ' aria-label="' + esc(mdLabel(r.key) + ' 游玩 ' + fmtDur(r.min)) + '">' +
        '<span class="cal-day">' + r.d + '</span><span class="cal-min">' + esc(fmtShort(r.min)) + '</span>' +
        '<span class="cal-bar" style="height:' + Math.max(7, Math.round(r.min / (cal.max || 1) * 100)) + '%"></span></button>'
      : '<span class="cal-cell is-idle' + (r.today ? ' is-today' : '') + '"><span class="cal-day">' + r.d + '</span></span>');
  });
  while (calCells.length % 7) calCells.push('<span class="cal-cell is-out"></span>');

  const calCard = pageCard({
    id: 'stats-calendar', title: '日历', hint: '有记录的日期可点击，作为筛选条件',
    tools: '<button class="icon-btn" data-act="stats-month" data-delta="-1" aria-label="上一个月">' + ico('chev-left', 14) + '</button>' +
      '<span class="meta" style="min-width:76px;text-align:center">' + esc(cal.y + ' 年 ' + (cal.m + 1) + ' 月') + '</span>' +
      '<button class="icon-btn" data-act="stats-month" data-delta="1" aria-label="下一个月">' + ico('chev-right', 14) + '</button>',
    body: '<div class="cal-week"><span>一</span><span>二</span><span>三</span><span>四</span><span>五</span><span>六</span><span>日</span></div>' +
      '<div class="cal-grid">' + calCells.join('') + '</div>' +
      '<div class="row-between gap-3" style="margin-top:var(--space-4);padding-top:var(--space-3);border-top:1px solid var(--border)">' +
      '<span class="meta">本月合计</span><span class="num" style="color:var(--fg)">' + esc(fmtDur(cal.monthTotal)) + '</span></div>' +
      '<div class="row-between gap-3" style="margin-top:6px"><span class="meta">活跃天数</span><span class="num" style="color:var(--fg)">' + cal.monthDays + ' 天</span></div>'
  });

  return '<div class="view">' + statsCard + '<div class="grid-play">' + chartCard + calCard + '</div></div>';
};

ACTIONS['stats-validate'] = function () {
  const s = state.stats;
  if (s.range !== 'custom') { s.err = ''; return; }
  const f = parseYmd(s.from), t = parseYmd(s.to);
  if (!f || !t) s.err = '请填写完整的起止日期';
  else if (f > t) s.err = '开始日期不能晚于结束日期';
  else if (Math.round((t - f) / DAY_MS) > RECORD_DAYS) s.err = '自定义范围最多 ' + (RECORD_DAYS + 1) + ' 天';
  else s.err = '';
};
ACTIONS['stats-range'] = function (el) {

  state.stats.range = v;

    if (!state.stats.from) state.stats.from = ymd(addDays(today, -29));

  const rec = recoveryOf(instId);

  if (!r) return;
  if (r.status === 'conflict') {
    r.status = 'partial';
    r.note = '原位置已有同名文件，已跳过（未覆盖）';
    toast('部分文件未恢复', '原位置已有同名文件，已跳过（未覆盖）（模拟）', 'warn');
    paintDrawer(); return;
  }
  if (r.replaces) state.mods[instId] = modsOf(instId).filter((x) => x.id !== r.replaces);
  modsOf(instId).push({
    id: 'm-' + Date.now(), file: r.file, name: r.name || '未知 Mod', version: r.from || '未知',
    loader: instanceById(instId) && instanceById(instId).loader.indexOf('Forge') >= 0 ? 'Forge' : 'Fabric',
    size: r.size, enabled: false
  });
  state.recovery[instId] = rec.filter((x) => x.id !== r.id);
  syncModCount(instId);
  toast(r.reason === 'Mod 更新' ? '已撤销本次更新' : '已恢复到原位置',

      '<div class="field"><label for="sName">服务器名称</label><input class="input" id="sName" type="text" placeholder="我的服务器" autocomplete="off"></div>' +
      '<div class="row gap-3" style="align-items:flex-end">' +
      '<div class="field grow"><label for="sHost">地址</label><input class="input num" id="sHost" type="text" placeholder="play.example.com" autocomplete="off"></div>' +
      '<div class="field" style="width:104px"><label for="sPort">端口</label><input class="input num" id="sPort" type="number" value="25565" min="1" max="65535"></div></div>' +
      '<p class="hint">原型不会真实连接该服务器。</p>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-act="server-add-go">添加</button>',
    onSubmit: () => ACTIONS['server-add-go']()
  });
};
ACTIONS['server-add-go'] = function () {
  const name = $('#sName').value.trim(), host = $('#sHost').value.trim(), port = +$('#sPort').value || 25565;
  if (!name || !host) {
    const err = $('#modalErr');
    err.hidden = false; err.innerHTML = ico('alert', 13) + '<span>请填写名称和地址</span>';
    (!name ? $('#sName') : $('#sHost')).setAttribute('aria-invalid', 'true');
    (!name ? $('#sName') : $('#sHost')).focus(); return;
  }
  state.servers.push({ id: 'srv-' + Date.now(), name: name, host: host, port: port, online: false, players: 0, cap: 0, ping: null, ver: '未知', fav: false });
  toast('服务器已添加', '（模拟）不会真实连接', 'ok');
  closeModal(true); render();
};
ACTIONS['server-ping'] = function (el) {
  const s = state.servers.filter((x) => x.id === el.dataset.id)[0];
  toast('正在 Ping ' + s.name + '…', null, 'info');
  setTimeout(() => {
    s.online = true;
    s.ping = 24 + Math.floor(Math.random() * 90);
    s.players = 100 + Math.floor(Math.random() * 4000);
    s.cap = 10000;
    toast(s.name + ' 延迟 ' + s.ping + ' ms', '模拟结果 · 未真实连接服务器', 'ok');
    render();
  }, 800);
};
ACTIONS['server-fav'] = function (el) {
  const s = state.servers.filter((x) => x.id === el.dataset.id)[0];
  s.fav = !s.fav;
  toast(s.fav ? '已收藏 ' + s.name : '已取消收藏 ' + s.name, null, 'ok');
  render();
};
ACTIONS['server-del'] = function (el) {
  const s = state.servers.filter((x) => x.id === el.dataset.id)[0];
  openModal({
    title: '删除「' + s.name + '」？', desc: '仅从收藏列表移除。',
    body: '<p class="fg2" style="font-size:var(--text-sm)">地址：<span class="num">' + esc(s.host) + '</span></p>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">取消</button>' +
      '<button class="btn btn-danger" data-act="server-del-go" data-id="' + s.id + '">删除</button>'
  });
};
ACTIONS['server-del-go'] = function (el) {
  state.servers = state.servers.filter((x) => x.id !== el.dataset.id);
  toast('已删除', null, 'ok'); closeModal(true); render();
};

ACTIONS['content-install'] = function (el) {
  const id = el.dataset.id;
  const list = state.content[state.filters.tab];
  const item = list.filter((c) => c.id === id)[0];
  if (!item) return;
  item.state = 'installing'; item.pct = 0;
  toast('已加入安装队列', item.name + ' · 目标实例：' + (currentInstance() ? currentInstance().name : '未选择'), 'info');
  render();
  const step = setInterval(() => {
    item.pct = Math.min(100, (item.pct || 0) + 12);
    const label = $('[data-inst-pct="' + id + '"]');
    if (item.pct >= 100) {
      clearInterval(step); item.state = 'installed';
      toast(item.name + ' 安装完成', '（模拟）未下载或写入任何文件', 'ok');
      if (state.view === 'content') render();
      return;
    }
    if (label) label.textContent = '安装中 ' + item.pct + '%';
  }, 420);
};
ACTIONS['content-retry'] = function () {
  toast('正在重试…', null, 'info');
  state.offline = false; state.newsVerified = true; state.load.content = 'ready';
  setTimeout(() => { toast('重试成功，内容已更新', '模拟结果', 'ok'); render(); }, 700);
};

ACTIONS['skin-model'] = function (el) { state.skinModel = el.dataset.value; toast('已切换模型', el.dataset.value === 'classic' ? '经典模型（4px 宽手臂）' : 'Slim / Alex 模型（3px 宽手臂）', 'ok'); render(); };
ACTIONS['skin-upload'] = function () {
  if (!state.account) { toast('请先登录一个账号', '皮肤上传仅支持 Microsoft 正版账号', 'warn'); return; }
  toast('请选择皮肤文件', '仅支持 64×64 或 64×32 PNG，且不超过 1 MiB（模拟）', 'info');
};
ACTIONS['skin-login'] = function () { ACTIONS['add-account'](); };

ACTIONS['dl-start'] = function (el) {
  const v = el.dataset.id;
  state.tasks.push({ id: 't' + Date.now(), name: v + ' · 客户端与资源', state: 'downloading', pct: 2, speed: '3.1 MB/s', eta: '01:20', size: '304 MB' });
  toast('已加入下载：' + v, '（模拟）不会真实下载文件', 'ok');
  render(); startTicker();
};
ACTIONS['dl-retry'] = function () {
  toast('正在重新获取版本列表…', null, 'info');
  state.offline = false;
  setTimeout(() => { toast('版本列表已更新', '模拟结果 · 共 ' + DB.versions.length + ' 个版本', 'ok'); render(); }, 700);
};
ACTIONS['task-toggle'] = function (el) {
  const t = state.tasks.filter((x) => x.id === el.dataset.id)[0];
  t.state = t.state === 'downloading' ? 'queued' : 'downloading';
  toast(t.state === 'downloading' ? '已继续任务' : '已暂停任务', t.name + '（模拟）', 'info');
  render();
};
ACTIONS['task-cancel'] = function (el) {
  state.tasks = state.tasks.filter((x) => x.id !== el.dataset.id);
  toast('已移除任务', '（模拟）', 'ok'); render();
};
ACTIONS['task-clear'] = function () {
  state.tasks = state.tasks.filter((t) => t.state !== 'completed');
  toast('已清除已完成任务', '（模拟）', 'ok'); render();
};

ACTIONS['news-refresh'] = function () {
  toast('刷新中…', null, 'info');
  setTimeout(() => {
    if (state.offline) {
      state.newsState = 'error'; state.newsVerified = false;
      toast('新闻刷新失败', '当前处于离线模式（模拟）', 'err');
    } else {
      state.newsState = 'live'; state.newsVerified = true;
      toast('已同步官方最新', '模拟结果 · 内容为本地示例', 'ok');
    }
    render();
  }, 800);
};
ACTIONS['news-retry'] = function () {
  toast('正在重试…', null, 'info');
  setTimeout(() => { state.offline = false; state.newsState = 'live'; state.newsVerified = true; toast('重试成功', '模拟结果', 'ok'); render(); }, 700);
};
ACTIONS['news-open'] = function (el) {
  const n = state.news.filter((x) => x.id === el.dataset.id)[0];
  if (!n) return;
  openModal({
    title: n.title, desc: n.cat + ' · ' + n.time,
    body: '<p class="fg2" style="font-size:var(--text-sm);line-height:1.85">' + esc(n.body) + '</p>' +
      '<p class="card-hint">示例内容：原型不联网，正文为本地占位文案。</p>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">关闭</button>' +
      '<button class="btn btn-secondary" data-act="news-link" data-id="' + n.id + '">' + ico('external', 14) + '<span>查看原文</span></button>'
  });
};
ACTIONS['news-link'] = function () { toast('打开失败，请重试', '原型内不会打开外部链接（模拟）', 'warn'); };

ACTIONS['set-auto-mem'] = function (el) { state.settings.autoMem = el.checked; toast(el.checked ? '已开启自动内存分配' : '已关闭自动内存分配', el.checked ? '由启动器选择合适的内存大小' : '可手动拖动滑块调整（模拟保存）', 'ok'); render(); };
ACTIONS['set-mirror'] = function (el) { state.settings.mirror = el.checked; toast('已保存下载镜像设置', el.checked ? '通过 BMCLAPI 镜像加速下载（模拟）' : '使用官方源（模拟）', 'ok'); };
ACTIONS['set-fakeip'] = function (el) { state.settings.fakeIp = el.checked; toast('fake-IP 兼容开关已保存', '仅影响官方新闻图片（模拟）', 'ok'); };
ACTIONS['set-ai'] = function (el) { state.settings.ai = el.checked; toast(el.checked ? '已启用 AI 崩溃诊断' : '已关闭 AI 崩溃诊断', '需要配置 API Key 才能真正使用（模拟）', 'ok'); };
ACTIONS['set-quick'] = function (el) {
  const key = el.dataset.key;
  if (key === 'quickMin') state.settings.quick.minimize = el.checked;
  if (key === 'quickClose') state.settings.quick.close = el.checked;
  toast('快捷操作已保存', '（模拟）不会真实最小化或关闭窗口', 'ok');
};
ACTIONS['set-offline'] = function (el) { ACTIONS['toggle-offline'](); };
ACTIONS['set-source'] = function (el) { state.settings.source = el.dataset.value; toast('已切换下载源：' + (el.dataset.value === 'official' ? '官方源' : 'MCBBS 镜像'), '（模拟）', 'ok'); render(); };
ACTIONS['set-java'] = function () {
  const order = ['bundled', 'auto', 'custom'];
  state.settings.java = order[(order.indexOf(state.settings.java) + 1) % 3];
  const label = state.settings.java === 'bundled' ? '内置 JRE 21.0.5' : state.settings.java === 'auto' ? '自动检测（3 个 JDK）' : '自定义路径';
  toast('已切换 Java：' + label, '（模拟）未检测本机运行时', 'ok');
  render();
};
ACTIONS['set-proxy'] = function () {
  const p = state.settings.proxy;
  openModal({
    title: '配置代理', desc: '下载与登录请求走代理。',
    body: '<div id="modalErr" class="field error" hidden></div>' +
      '<label class="check"><input type="checkbox" id="pOn"' + (p.on ? ' checked' : '') + '><span>启用代理</span></label>' +
      '<div class="row gap-3"><div class="field grow"><label for="pHost">代理地址</label><input class="input num" id="pHost" type="text" value="' + esc(p.host) + '" placeholder="127.0.0.1"></div>' +
      '<div class="field" style="width:112px"><label for="pPort">端口</label><input class="input num" id="pPort" type="number" value="' + p.port + '" min="1" max="65535"></div></div>' +
      '<div class="row gap-3"><div class="field grow"><label for="pUser">用户名（可选）</label><input class="input" id="pUser" type="text" value="' + esc(p.user) + '" autocomplete="off"></div>' +
      '<div class="field grow"><label for="pPass">密码（可选）</label><input class="input" id="pPass" type="password" value="' + esc(p.pass) + '" autocomplete="off"></div></div>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-act="set-proxy-go">保存</button>',
    onSubmit: () => ACTIONS['set-proxy-go']()
  });
};
ACTIONS['set-proxy-go'] = function () {
  const on = $('#pOn').checked, host = $('#pHost').value.trim(), port = +$('#pPort').value || 7890;
  if (on && !host) {
    const err = $('#modalErr');
    err.hidden = false; err.innerHTML = ico('alert', 13) + '<span>启用代理时必须填写代理地址</span>';
    $('#pHost').setAttribute('aria-invalid', 'true'); $('#pHost').focus(); return;
  }
  state.settings.proxy = { on: on, host: host, port: port, user: $('#pUser').value.trim(), pass: $('#pPass').value };
  toast('代理设置已保存', '（模拟）不会真实走代理', 'ok');
  closeModal(true); render();
};
ACTIONS['set-providers'] = function () {
  const ps = state.settings.providers;
  openModal({
    title: '管理 AI 提供商', desc: '发布安全模式下仅允许代码内审核过的 HTTPS 提供商。',
    body: (ps.length ? '<div class="list">' + ps.map((p) =>
      '<div class="list-row" style="padding:10px 4px"><span class="thumb" style="width:30px;height:30px;flex-basis:30px">' + ico('cpu', 14) + '</span>' +
      '<span class="grow stack" style="gap:2px"><span class="row-title">' + esc(p.name) + '</span>' +
      '<span class="row-sub num anywhere">' + esc(p.url) + ' · ' + esc(p.model) + '</span></span>' +
      (p.active ? chip('当前', 'chip-ok') : '') + '</div>').join('') + '</div>'
      : stateBlock({ icon: 'cpu', title: '暂无提供商', desc: '点击下方「新增」添加一个。' })) +
      '<p class="card-hint">API Key 只在本地保存，原型内不会发出任何请求。</p>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">关闭</button>' +
      '<button class="btn btn-secondary" data-act="ai-add">新增</button>'
  });
};
ACTIONS['ai-add'] = function () {
  openModal({
    title: '新增 AI 提供商',
    body: '<div id="modalErr" class="field error" hidden></div>' +
      '<div class="field"><label for="aiName">名称</label><input class="input" id="aiName" type="text" placeholder="预设 · DeepSeek" autocomplete="off"></div>' +
      '<div class="field"><label for="aiUrl">服务地址</label><input class="input num" id="aiUrl" type="text" placeholder="https://api.example.com" autocomplete="off"></div>' +
      '<div class="field"><label for="aiModel">模型名称</label><input class="input num" id="aiModel" type="text" placeholder="model-name" autocomplete="off"></div>' +
      '<div class="field"><label for="aiKey">API Key</label><input class="input num" id="aiKey" type="password" placeholder="新增时必填" autocomplete="off"></div>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-act="ai-add-go">保存</button>',
    onSubmit: () => ACTIONS['ai-add-go']()
  });
};
ACTIONS['ai-add-go'] = function () {
  const name = $('#aiName').value.trim(), url = $('#aiUrl').value.trim();
  if (!name || !url) {
    const err = $('#modalErr');
    err.hidden = false; err.innerHTML = ico('alert', 13) + '<span>请填写名称与服务地址</span>';
    (!name ? $('#aiName') : $('#aiUrl')).setAttribute('aria-invalid', 'true');
    (!name ? $('#aiName') : $('#aiUrl')).focus(); return;
  }
  state.settings.providers.forEach((p) => { p.active = false; });
  state.settings.providers.push({ id: 'a' + Date.now(), name: name, url: url, model: $('#aiModel').value.trim() || 'default', active: true, hasKey: !!$('#aiKey').value });
  toast('AI 提供商配置已保存', '（模拟）未发出任何请求', 'ok');
  closeModal(true); render();
};
ACTIONS['check-update'] = function () {
  toast('正在检查更新…', null, 'info');
  setTimeout(() => { state.updating = 'done'; toast('已是最新版本', '当前版本 v1.4.2（模拟）', 'ok'); render(); }, 900);
};
ACTIONS['open-logs'] = function () { toast('已请求打开日志目录', '原型内不会真实打开目录（模拟）', 'info'); };
ACTIONS['add-account'] = function () {
  if (state.account) { toast('已登录：' + state.account.name, '切换账户在正式版中可用（模拟）', 'info'); return; }
  openModal({
    title: '添加账户', desc: '正版功能需要 Microsoft 账户；也可以添加离线账户。',
    body: '<div id="modalErr" class="field error" hidden></div>' +
      '<div class="stack gap-2">' +
      '<button class="list-row" data-act="acc-ms" style="width:100%;text-align:left;border-radius:var(--radius-sm)">' +
      ico('shield') + '<span class="grow stack" style="gap:2px"><span class="row-title">Microsoft 登录</span>' +
      '<span class="row-sub">使用设备码登录，无需在启动器内填写密码</span></span></button>' +
      '<button class="list-row" data-act="acc-offline" style="width:100%;text-align:left;border-radius:var(--radius-sm)">' +
      ico('user') + '<span class="grow stack" style="gap:2px"><span class="row-title">添加离线账户</span>' +
      '<span class="row-sub">无需登录即可进入游戏，仅限单人存档</span></span></button>' +
      '</div><p class="card-hint">原型内不会发起任何授权请求，也不会创建真实账户。</p>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">取消</button>'
  });
};
ACTIONS['acc-ms'] = function () { closeModal(true); toast('Microsoft 登录不可用', '原型内不会打开浏览器或请求授权（模拟）', 'warn'); };
ACTIONS['acc-offline'] = function () {
  openModal({
    title: '添加离线账户', desc: '添加一个无需登录的离线账户。',
    body: '<div id="modalErr" class="field error" hidden></div>' +
      '<div class="field"><label for="pName">玩家名称</label><input class="input" id="pName" type="text" placeholder="Steve" autocomplete="off">' +
      '<p class="hint">建议使用 3–16 个字符的英文或数字。</p></div>',
    foot: '<button class="btn btn-ghost" data-act="close-modal">取消</button>' +
      '<button class="btn btn-primary" data-act="acc-offline-go">添加</button>',
    onSubmit: () => ACTIONS['acc-offline-go']()
  });
};
ACTIONS['acc-offline-go'] = function () {
  const n = $('#pName').value.trim();
  if (!n) {
    const err = $('#modalErr');
    err.hidden = false; err.innerHTML = ico('alert', 13) + '<span>请填写玩家名称</span>';
    $('#pName').setAttribute('aria-invalid', 'true'); $('#pName').focus(); return;
  }
  state.account = { name: n, type: 'offline' };
  $('#accountBtn').innerHTML = '<span class="account-avatar" aria-hidden="true">' + ico('user', 15) + '</span>' +
    '<span class="account-text stack" style="align-items:flex-start;gap:2px;min-width:0"><span class="account-name">' + esc(n) + '</span>' +
    '<span class="account-sub"><span class="dot online" aria-hidden="true"></span>离线账户</span></span>';
  toast('已添加离线账户「' + n + '」', '（模拟）未创建真实账户，也不会用于在线服务器', 'ok');
  closeModal(true); render();
};
ACTIONS['refresh-all'] = function () {
  toast('正在重新检查环境…', null, 'info');
  setTimeout(() => toast('检查完成', 'Java、内存与游戏文件均可用（模拟）', 'ok'), 800);
};

init();
})();
</script>
</body>
</html>
